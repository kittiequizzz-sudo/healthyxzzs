<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 8 — the bigger picture: you're not alone; more medicine isn't failure.
window.START = at('b8') - 0.4;
window.END = at('b9') - 0.4;
window.DURATION = window.END;
const svg = Stage();

// 1. Mexico: 18 of 100 adults (a crowd fills in), then South & Central America: 35 million
scene(svg, () => START, () => at('escucharon'), g => {
  const people = [];
  for (let i = 0; i < 100; i++) {
    const x = 330 + (i % 20) * 66, y = 210 + Math.floor(i / 20) * 120;
    const p = el('g', {}, g);
    el('circle', { cx: x, cy: y, r: 20 }, p); el('rect', { x: x - 24, y: y + 24, width: 48, height: 56, rx: 18 }, p);
    p.setAttribute('fill', C.grey); people.push(p);
  }
  const big = Text(g, '', { x: 960, y: 520, size: 200, color: C.red });
  const caps = Captions(g, [['MÉXICO: 18 DE CADA 100 ADULTOS', 'dieciocho', { hi: '18 DE CADA 100', hiColor: C.red }], ['SUDAMÉRICA Y CENTROAMÉRICA', 'sudamerica'], ['USTED NO ESTÁ SOLO', 'millones', { fill: C.green, hi: 'NO ESTÁ SOLO', hiColor: C.ink }]], { cy: 960, size: 54 });
  const src = Text(g, '', { x: 960, y: 1052, size: 24, weight: 700, color: C.grey });
  return t => {
    const k = Math.round(18 * prog(t, at('dieciocho'), at('dieciocho') + 1.5));
    const fade = 1 - 0.8 * prog(t, at('sudamerica'), at('sudamerica') + 0.5);
    people.forEach((p, i) => { p.setAttribute('fill', i < k ? C.red : C.grey); p.setAttribute('opacity', fade); });
    big.textContent = t > at('millones') - 0.8 ? Math.round(35 * E.out(prog(t, at('millones') - 0.8, at('millones') + 0.5))) + ' MILLONES' : '';
    show(big, t, at('millones') - 0.8, 1e9, { dy: 30, dur: 0.3 });
    src.textContent = t < at('sudamerica') ? 'ENSANUT 2022 · Salud Pública de México' : 'FID · Atlas de la Diabetes · 2024';
    caps(t);
  };
});

// 2. guilt → a different idea
scene(svg, () => at('escucharon'), () => at('vanidad'), g => {
  const s1 = full(g, 'c_duda', { focus: [0.42, 0.3], zoom: 0.12 });
  const z = el('g', {}, g);
  const s2 = full(z, 'c_silla', { focus: [0.45, 0.35], zoom: 0.1 });
  const caps = Captions(g, [['«HAY QUE SUBIRLE LA MEDICINA»', 'escucharon'], ['…Y SE SIENTEN CULPABLES', 'culpables2', { fill: C.amber, color: C.ink }], ['NO ES QUE COMA PEOR', 'otraidea'], ['SU CUERPO CAMBIÓ', 'cambio', { size: 72, hi: 'CAMBIÓ' }], ['SUBIR LA MEDICINA ≠ FRACASAR', 'fracasar', { hi: '≠ FRACASAR', hiColor: C.green }], ['ES ACOMPAÑAR A SU CUERPO', 'acompanar', { fill: C.green }]], { cy: 970 });
  return t => {
    const k = E.inOut(prog(t, at('otraidea') - 0.3, at('otraidea') + 0.2));
    s1.g.setAttribute('opacity', 1 - k); z.setAttribute('opacity', k);
    s1.draw(t, at('escucharon'), at('otraidea')); s2.draw(t, at('otraidea'), at('vanidad'));
    punch(z, t, at('cambio'), 960, 420, 0.06); caps(t);
  };
});

// 3. muscle = independence (the dance)
scene(svg, () => at('vanidad'), () => END + 1, g => {
  const z = el('g', {}, g);
  const st = full(z, 'c_baile', { focus: [0.45, 0.4], zoom: 0.1 });
  const caps = Captions(g, [['CUIDAR EL MÚSCULO NO ES VANIDAD', 'vanidad', { hi: 'NO ES VANIDAD' }], ['LEVANTARSE SOLO', 'levantarse'], ['CARGAR A UN NIETO', 'nieto'], ['BAILAR EN LA BODA', 'bailar', { fill: C.green }]], { cy: 970 });
  return t => { st.draw(t, at('vanidad'), END); punch(z, t, at('bailar'), 700, 450, 0.06); caps(t); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
