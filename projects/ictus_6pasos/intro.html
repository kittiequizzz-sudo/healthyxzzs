<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Intro — hook: what a stroke takes away, the signs, six steps, call 112.
window.START = 0;
window.END = at('p1') - 0.6;
window.DURATION = window.END;
const svg = Stage();
const cap = (g, s, o = {}) => Caption(g, s, { cy: 965, size: 62, ...o });

// 1–4. cold open: waking up unable to… (hard cuts)
stillScene(svg, 'l4', () => -1, () => at('brazo'), { focus: [0.35, 0.4], zoom: 0.1 }, g => {
  const c = cap(g, '¿Y SI MAÑANA…?', { hi: 'MAÑANA' });
  return t => show(c, t, at('manana') + 0.3);
}, true);
stillScene(svg, 'a1', () => at('brazo'), () => at('caminar'), { focus: [0.35, 0.45], zoom: 0.12 }, g => {
  const c = cap(g, 'MOVER UN BRAZO', { hi: 'BRAZO' });
  return t => show(c, t, at('brazo') + 0.2);
}, true);
stillScene(svg, 'a3', () => at('caminar'), () => at('hijos'), { focus: [0.4, 0.4], zoom: 0.12 }, g => {
  const c = cap(g, 'CAMINAR SIN AYUDA', { hi: 'SIN AYUDA' });
  return t => show(c, t, at('caminar') + 0.1);
}, true);
stillScene(svg, 'a4', () => at('hijos'), () => at('doloroso'), { focus: [0.5, 0.35], zoom: 0.1 }, g => {
  const c = cap(g, 'EL NOMBRE DE TUS HIJOS', { hi: 'HIJOS' });
  return t => show(c, t, at('hijos') + 0.1);
}, true);

// 5. the brain: a stroke's damage can be reduced
scene(svg, () => at('doloroso'), () => at('reconocido'), g => {
  const b = el('g', {}, g);
  const fl = floatCut(b, 'brain', 960, 470, 700);
  const pu = Pulse(b, 1010, 400, 46);
  const w = Text(g, 'ICTUS', { x: 960, y: 140, size: 130, color: C.red });
  const c = cap(g, 'CONSECUENCIAS QUE SE PUEDEN REDUCIR', { size: 54, hi: 'REDUCIR' });
  return t => {
    fl(t); pu(t); pop(b, t, at('doloroso'), 960, 470);
    pop(w, t, at('consecuencias'), 960, 140); show(c, t, at('reducirse'));
  };
}, true);
stillScene(svg, 'f1', () => at('reconocido'), () => at('atiempo'), { focus: [0.55, 0.6], zoom: 0.14 }, g => {
  const c = cap(g, 'RECONOCER LAS SEÑALES', { hi: 'SEÑALES' });
  return t => show(c, t, at('reconocido'));
}, true);
stillScene(svg, 'r4', () => at('atiempo'), () => at('sesenta'), { focus: [0.75, 0.4], zoom: 0.1 }, g => {
  const ck = MinuteClock(g, { cx: 1690, cy: 230, r: 130 });
  const c = cap(g, 'PEDIR AYUDA A TIEMPO', { hi: 'A TIEMPO' });
  return t => { ck.draw(t, at('atiempo')); pop(ck.g, t, at('atiempo') + 0.2, 1690, 230); show(c, t, at('atiempo')); };
}, true);

// 6. after 60: losing autonomy
stillScene(svg, 'l3', () => at('sesenta'), () => at('vestirte'), { focus: [0.45, 0.4], zoom: 0.08 }, g => {
  const n = el('g', {}, g);
  el('circle', { cx: 330, cy: 300, r: 190, fill: C.orange, stroke: C.ink, 'stroke-width': 10 }, n);
  Text(n, '+60', { x: 330, y: 310, size: 170, color: C.white });
  const c = cap(g, 'PERDER LA AUTONOMÍA', { hi: 'AUTONOMÍA' });
  return t => { pop(n, t, at('sesenta') + 0.2, 330, 300); show(c, t, at('autonomia')); };
}, true);
stillScene(svg, 'a1', () => at('vestirte'), () => at('comer'), { focus: [0.3, 0.5], zoom: 0.15 }, g => {
  const c = cap(g, 'VESTIRTE SOLO', { hi: 'SOLO' });
  return t => show(c, t, at('vestirte'));
}, true);
stillScene(svg, 'a2', () => at('comer'), () => at('familia'), { focus: [0.45, 0.4], zoom: 0.12 }, g => {
  const c = cap(g, 'AYUDA PARA COMER', { hi: 'COMER' });
  return t => show(c, t, at('comer'));
}, true);
stillScene(svg, 'a3', () => at('familia'), () => at('insignif'), { focus: [0.62, 0.35], zoom: 0.16 }, g => {
  const c = cap(g, 'DEPENDER DE TU FAMILIA', { hi: 'FAMILIA' });
  return t => show(c, t, at('familia'));
}, true);

// 7. it starts small: three signs pop in
scene(svg, () => at('insignif'), () => at('peligro'), g => {
  const h = cap(g, 'TODO EMPIEZA CON ALGO PEQUEÑO', { cy: 140, hi: 'PEQUEÑO' });
  const items = [['f1', 'sonrisa', 'SONRISA TORCIDA'], ['f2', 'mano', 'MANO SIN FUERZA'], ['f3', 'palabras', 'PALABRAS QUE NO SALEN']].map(([n, k, s], i) => {
    const c = el('g', {}, g), x = 60 + i * 610;
    const st = still(c, n, { x, y: 300, w: 580, h: 420, r: 24, focus: [0.5, 0.45], zoom: 0.1 });
    Chip(c, s, { cx: x + 290, cy: 810, size: 34 });
    return [c, k, x + 290, st];
  });
  return t => {
    show(h, t, at('insignif'));
    items.forEach(([c, k, cx, st]) => { pop(c, t, at(k), cx, 560); st.draw(t, at(k), at('peligro')); });
  };
}, true);

// 8. the real danger: "it will pass with some rest"
stillScene(svg, 'r3', () => at('peligro'), () => at('seis'), { focus: [0.3, 0.4], zoom: 0.12 }, g => {
  const a = cap(g, 'EL VERDADERO PELIGRO', { hi: 'PELIGRO' });
  const b = el('g', {}, g);
  Caption(b, '«YA SE PASARÁ…»', { cy: 965, size: 66, fill: C.red });
  const x = el('g', {}, g); Icon.cross(x, 1640, 120, 1.6);
  return t => { show(a, t, at('peligro'), at('descanso')); show(b, t, at('descanso')); pop(x, t, at('descanso') + 0.8, 1720, 200); };
}, true);

// 9. six steps
scene(svg, () => at('seis'), () => at('ambulancia0'), g => {
  const h = Text(g, '6 PASOS', { x: 960, y: 170, size: 120, color: C.orange });
  const tiles = StepRow(g, { y: 520, size: 250 });
  return t => {
    pop(h, t, at('seis'), 960, 170);
    tiles.forEach((s, i) => { pop(s.g, t, at('seis') + 0.3 + i * 0.18, s.cx, s.cy); float(s.g.firstChild, t, s.cx, s.cy, { phase: i * 0.2, amp: 4 }); });
  };
});
stillScene(svg, 'e1', () => at('ambulancia0'), () => at('errores0'), { focus: [0.5, 0.45], zoom: 0.08 }, g => {
  const c = cap(g, 'MIENTRAS LLEGA LA AMBULANCIA', { hi: 'AMBULANCIA' });
  return t => show(c, t, at('ambulancia0'));
}, true);
stillScene(svg, 'e4', () => at('errores0'), () => at('minuto0'), { focus: [0.45, 0.4], zoom: 0.08 }, g => {
  const x = el('g', {}, g); Icon.cross(x, 1620, 100, 1.8);
  const c = cap(g, 'ERRORES QUE EVITAR', { hi: 'EVITAR' });
  return t => { pop(x, t, at('errores0') + 0.2, 1710, 190); show(c, t, at('errores0')); };
}, true);
scene(svg, () => at('minuto0'), () => at('esencial'), g => {
  const ck = MinuteClock(g, { cx: 960, cy: 470, r: 280 });
  const c = cap(g, 'CADA MINUTO IMPORTA', { cy: 900, size: 72, hi: 'MINUTO' });
  return t => { ck.draw(t, at('minuto0')); pop(ck.g, t, at('minuto0'), 960, 470); show(c, t, at('minuto0') + 0.3); };
}, true);

// 10. call 112 now — don't wait for the end of the video
stillScene(svg, 'r4', () => at('esencial'), () => at('quedate'), { focus: [0.75, 0.4], zoom: 0.06 }, g => {
  Veil(g, 0.55);
  const h = Text(g, 'ANTE CUALQUIER SOSPECHA', { x: 960, y: 230, size: 76, color: C.cream });
  const b = Badge112(g, { cx: 960, cy: 520, size: 1.6 });
  const c = cap(g, 'NO ESPERES AL FINAL DEL VÍDEO', { size: 60, fill: C.red, hi: 'NO ESPERES' });
  return t => { show(h, t, at('esencial') + 0.6); b.draw(t, at('llama112')); show(c, t, at('noesperes')); };
});

// 11. stay: your independence, someone you love
scene(svg, () => at('quedate'), () => END + 1, g => {
  const s1 = still(g, 'e1', { focus: [0.62, 0.55], zoom: 0.1 });
  const s2 = still(g, 'a4', { focus: [0.5, 0.4], zoom: 0.1 });
  const a = cap(g, 'TU INDEPENDENCIA', { hi: 'INDEPENDENCIA' });
  const b = cap(g, 'ALGUIEN A QUIEN QUIERES', { hi: 'QUIERES' });
  return t => {
    const k = E.inOut(prog(t, at('quieres') - 0.2, at('quieres') + 0.2));
    s1.g.setAttribute('opacity', 1 - k); s2.g.setAttribute('opacity', k);
    s1.draw(t, at('quedate'), at('quieres')); s2.draw(t, at('quieres'), END);
    show(a, t, at('independencia'), at('quieres')); show(b, t, at('quieres') + 0.2);
  };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
