<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 1 — the hook. YouTube style: a hard cut every ~2 s, pictures full-bleed, captions ≤ 6 words.
window.START = 0;
window.END = at('b2') - 0.3;
window.DURATION = window.END;
const svg = Stage();
const drama = g => Text(g, 'Doña Carmen es un personaje · Dramatización · Cifras de ejemplo', { x: 1880, y: 40, size: 22, weight: 700, color: C.white, anchor: 'end' });
// glucometer with a number on its screen (screen ≈ 0.21–0.81 × 0.15–0.48 of the cut-out)
function Meter(g, cx, cy, fit, col) {
  const m = el('g', {}, g);
  cut(m, 'glucometro', cx, cy, fit);
  const s = fit / 395, w = 257 * s, h = 395 * s;
  const n = Text(m, '', { x: cx - w / 2 + 130 * s, y: cy - h / 2 + 125 * s, size: 72 * s, color: col });
  return { m, n };
}

// 1. Carmen at breakfast
hard(svg, () => -1, () => at('tortillas'), g => {
  const z = el('g', {}, g);
  const st = full(z, 'c_desayuno', { focus: [0.42, 0.45], zoom: 0.14 });
  const c = Caption(g, 'DOÑA CARMEN · 71 AÑOS', { cy: 960, hi: '71 AÑOS' });
  drama(g);
  return t => { st.draw(t, 0, at('tortillas')); punch(z, t, at('desayuna'), 1150, 430, 0.1); show(c, t, at('carmen') + 0.2, 1e9, { dy: 20, dur: 0.3 }); };
});

// 2. the same breakfast for ten years
hard(svg, () => at('tortillas'), () => at('hace10'), g => {
  const pl = el('g', {}, g); cut(pl, 'plato', 0, 0, 820);
  const cup = el('g', {}, g); cut(cup, 'cafe', 0, 0, 360);
  const c = Caption(g, 'EL MISMO DESAYUNO · 10 AÑOS', { cy: 960, hi: '10 AÑOS' });
  drama(g);
  return t => {
    slideIn(pl, t, at('tortillas'), 'l', 300); pl.setAttribute('transform', pl.getAttribute('transform') + ' translate(820 500)');
    slideIn(cup, t, at('cafe') - 0.2, 'r', 300); cup.setAttribute('transform', cup.getAttribute('transform') + ` translate(1470 ${470 + 8 * Math.sin(t * 2)})`);
    show(c, t, at('frijoles'), 1e9, { dy: 20, dur: 0.3 });
  };
});

// 3. ten years ago: 140
hard(svg, () => at('hace10'), () => at('hoy'), g => {
  const z = el('g', {}, g);
  const pl = el('g', {}, z); cut(pl, 'plato', 600, 560, 640);
  const M = Meter(z, 1350, 540, 620, C.green);
  const c = Caption(g, 'HACE 10 AÑOS', { cy: 960 });
  return t => {
    punch(z, t, at('m140'), 1350, 540, 0.07);
    M.n.textContent = Math.round(90 + 50 * E.out(prog(t, at('hace10') + 0.3, at('m140') + 0.3)));
    show(c, t, at('hace10'), 1e9, { dy: 20, dur: 0.3 });
  };
});

// 4. today, same plate: 190
hard(svg, () => at('hoy'), () => at('consulta'), g => {
  const z = el('g', {}, g);
  const pl = el('g', {}, z); cut(pl, 'plato', 600, 560, 640);
  const M = Meter(z, 1350, 540, 620, C.red);
  const c = Caption(g, 'HOY · EL MISMO PLATO', { cy: 960, hi: 'HOY', hiColor: C.red });
  return t => {
    punch(z, t, at('m190'), 1350, 540, 0.1);
    M.n.textContent = Math.round(140 + 50 * E.out(prog(t, at('m190') - 0.4, at('m190') + 0.5)));
    show(c, t, at('hoy'), 1e9, { dy: 20, dur: 0.3 });
  };
});

// 5. the consultation
hard(svg, () => at('consulta'), () => at('salio'), g => {
  const st = full(g, 'c_consulta', { focus: [0.62, 0.35], zoom: 0.12 });
  const c = Caption(g, '«HAY QUE SUBIRLE LA MEDICINA»', { cy: 960, hi: 'SUBIRLE', hiColor: C.red });
  drama(g);
  return t => { st.draw(t, at('consulta'), at('salio')); show(c, t, at('subirle'), 1e9, { dy: 20, dur: 0.3 }); };
});

// 6. "what am I doing wrong?"
hard(svg, () => at('salio'), () => at('parecido'), g => {
  const st = full(g, 'c_duda', { focus: [0.42, 0.3], zoom: 0.16 });
  const c = Caption(g, '¿QUÉ ESTOY HACIENDO MAL?', { cy: 960, hi: 'MAL' });
  drama(g);
  return t => { st.draw(t, at('salio'), at('parecido')); show(c, t, at('mal'), 1e9, { dy: 20, dur: 0.3 }); };
});

// 7. probably nothing wrong
hard(svg, () => at('parecido'), () => at('puzzle'), g => {
  const z = el('g', {}, g);
  const st = full(z, 'c_silla', { focus: [0.45, 0.35], zoom: 0.1 });
  const caps = Captions(g, [['¿LE PASÓ ALGO PARECIDO?', 'parecido'], ['NO ESTÁ HACIENDO NADA MAL', 'nada', { fill: C.green, hi: 'NADA', hiColor: C.ink }]], { cy: 960 });
  return t => { st.draw(t, at('parecido'), at('puzzle')); punch(z, t, at('nada'), 960, 400, 0.06); caps(t); };
});

// 8. same plate, more sugar? — it's not in the plate
hard(svg, () => at('puzzle'), () => at('tres'), g => {
  const z = el('g', {}, g);
  const pl = el('g', {}, z); cut(pl, 'plato', 960, 520, 900);
  const x = el('g', {}, g); Icon.cross(x, 1290, 230, 2);   // wrapped: pop() replaces the transform of what it animates
  const h = Caption(g, 'MISMO PLATO… ¿MÁS AZÚCAR?', { cy: 130, size: 64, hi: '¿MÁS AZÚCAR?' });
  const c = Caption(g, 'NO ESTÁ EN EL PLATO', { cy: 960 });
  return t => {
    punch(z, t, at('puzzle'), 960, 520, 0.06);
    show(h, t, at('puzzle'), 1e9, { dy: 20, dur: 0.3 });
    z.setAttribute('opacity', 1 - 0.55 * prog(t, at('noplato'), at('noplato') + 0.4));
    pop(x, t, at('noplato') + 0.3, 1390, 330); show(c, t, at('noplato') + 0.3, 1e9, { dy: 20, dur: 0.3 });
  };
});

// 9. three changes inside the body (three pictures)
hard(svg, () => at('tres'), () => at('hoyexp'), g => {
  const tiles = ['candado_oxidado', 'm_tienda_chica', 'm_fabrica_cansada'].map((n, i) => {
    const c = el('g', {}, g), x = 70 + i * 610;
    if (n.startsWith('m_')) { const st = still(c, n, { x, y: 230, w: 560, h: 560, focus: [0.5, 0.5], zoom: 0 }); st.draw(0, 0, 1); }
    else { Card(c, { x, y: 230, w: 560, h: 560, fill: C.white }); cut(c, n, x + 280, 510, 420); }
    el('circle', { cx: x + 60, cy: 290, r: 46, fill: C.orange, stroke: C.ink, 'stroke-width': 6 }, c);
    Text(c, String(i + 1), { x: x + 60, y: 293, size: 56, color: C.white });
    return [c, x + 280];
  });
  const caps = Captions(g, [['3 CAMBIOS DENTRO DE SU CUERPO', 'tres', { hi: '3 CAMBIOS' }], ['UNA PREGUNTA MUY COMÚN', 'comun']], { cy: 940 });
  return t => {
    tiles.forEach(([e, cx], i) => {
      pop(e, t, at('tres') + 0.2 + i * 0.35, cx, 510);
      if (t > at('tres') + 0.6 + i * 0.35) float(e, t, cx, 510, { amp: 5, phase: i * 0.3 });
    });
    caps(t);
  };
});

// 10. fast preview of what's coming (one picture per promise)
const promise = [['hoyexp', 'guias', 'm_fabrica', 'LAS 3 RAZONES'], ['guias', 'preguntas', 'e_doctora', 'LO QUE DICEN LAS GUÍAS'], ['preguntas', 'culpables', 'f_lista', '3 PREGUNTAS PARA SU CITA'], ['culpables', null, 'c_noche', '2 CULPABLES ESCONDIDOS']];
promise.forEach(([a, b, n, s]) => hard(svg, () => at(a), () => (b ? at(b) : END + 1), g => {
  const st = full(g, n, { focus: [0.5, 0.45], zoom: 0.12 });
  const c = Caption(g, s, { cy: 960, size: 60 });
  return t => { st.draw(t, at(a), b ? at(b) : END); show(c, t, at(a) + 0.1, 1e9, { dy: 20, dur: 0.25 }); };
}));

window.draw = t => drawScenes(t);
</script>
</body></html>
