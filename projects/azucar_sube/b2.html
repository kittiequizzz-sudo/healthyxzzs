<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 2 — not (only) the food. Picture first, one caption at a time.
window.START = at('b2') - 0.3;
window.END = at('b3') - 0.3;
window.DURATION = window.END;
const svg = Stage();

// 1. "you must be eating too much" — the family dinner
scene(svg, () => START, () => at('porciones'), g => {
  const st = full(g, 'e_familia', { focus: [0.5, 0.55], zoom: 0.1 });
  const caps = Captions(g, [['«¿SEGURO COME DE MÁS?»', 'demas'], ['A VECES ES CIERTO', 'honestos', { fill: C.amber, color: C.ink, hiColor: C.ink }]], { cy: 960 });
  return t => { st.draw(t, START, at('porciones')); caps(t); };
});

// 2. portions grow, soda every day
scene(svg, () => at('porciones'), () => at('fuera'), g => {
  const pl = el('g', {}, g); cut(pl, 'plato', 0, 0, 640);
  const soda = el('g', {}, g);
  el('path', { d: 'M-90 -230 L90 -230 L70 230 L-70 230 Z', fill: '#4A2A1A', stroke: C.ink, 'stroke-width': 10, 'stroke-linejoin': 'round' }, soda);
  el('rect', { x: -86, y: -230, width: 172, height: 40, fill: '#C9A27E', opacity: 0.8 }, soda);
  for (let i = 0; i < 6; i++) el('circle', { cx: -40 + (i * 23) % 80, cy: -150 + i * 55, r: 7, fill: C.white, opacity: 0.6 }, soda);
  const caps = Captions(g, [['PORCIONES MÁS GRANDES', 'porciones'], ['REFRESCO TODOS LOS DÍAS', 'refresco'], ['VALE LA PENA REVISARLO', 'revisarlo', { fill: C.green, hi: 'REVISARLO', hiColor: C.ink }]], { cy: 960 });
  return t => {
    const grow = 1 + 0.35 * E.back(prog(t, at('porciones') + 0.2, at('porciones') + 1.2));
    pl.setAttribute('transform', `translate(700 470) scale(${grow.toFixed(3)})`);
    slideIn(soda, t, at('refresco'), 'r', 500);
    soda.setAttribute('transform', soda.getAttribute('transform') + ` translate(1420 ${470 + 6 * Math.sin(t * 2)})`);
    caps(t);
  };
});

// 3. careful people: measured rice, no sweet bread
scene(svg, () => at('fuera'), () => at('aunasi'), g => {
  const st = full(g, 'e_arroz', { focus: [0.45, 0.5], zoom: 0.1 });
  const caps = Captions(g, [['¿Y LAS PERSONAS CUIDADOSAS?', 'cuidadosas'], ['MIDEN SU ARROZ', 'arroz'], ['NADA DE PAN DULCE', 'pandulce']], { cy: 960 });
  return t => { st.draw(t, at('fuera'), at('aunasi')); caps(t); };
});

// 4. and still it rises
scene(svg, () => at('aunasi'), () => at('idea'), g => {
  const ch = el('g', {}, g);
  el('line', { x1: 200, y1: 820, x2: 1720, y2: 820, stroke: C.ink, 'stroke-width': 8, 'stroke-linecap': 'round' }, ch);
  ['2016', '2021', '2026'].forEach((s, i) => Text(ch, s, { x: 260 + i * 700, y: 870, size: 40, weight: 800, color: C.grey }));
  const line = el('path', { d: 'M260 720 C600 700 900 650 1150 560 S1500 330 1660 260', fill: 'none', stroke: C.red, 'stroke-width': 18, 'stroke-linecap': 'round', 'stroke-dasharray': 1700, 'stroke-dashoffset': 1700 }, ch);
  const m = el('g', {}, g); cut(m, 'glucometro', 0, 0, 300);
  const c = Caption(g, 'Y AUN ASÍ, SUBE', { cy: 970, hi: 'SUBE', hiColor: C.red });
  return t => {
    const u = E.inOut(prog(t, at('aunasi'), at('aunasi') + 2));
    line.setAttribute('stroke-dashoffset', 1700 * (1 - u));
    const p = line.getPointAtLength(1700 * u * 0.98);
    m.setAttribute('transform', `translate(${p.x + 40} ${p.y - 170 + 6 * Math.sin(t * 2.5)})`);
    m.setAttribute('opacity', prog(t, at('aunasi'), at('aunasi') + 0.3));
    show(c, t, at('aunasi') + 0.8, 1e9, { dy: 20, dur: 0.3 });
  };
});

// 5. the central idea: your body changed
scene(svg, () => at('idea'), () => END + 1, g => {
  const z = el('g', {}, g);
  const body = el('g', {}, z); cut(body, 'body', 960, 520, 820);
  const organs = [['pancreas', 965, 412, 130], ['calf', 1006, 770, 120]].map(([n, x, y, f]) => { const o = el('g', {}, z); cut(o, n, x, y, f); return [o, x, y]; });
  const st = Stamp(g, 'NO ES (SOLO) LA COMIDA', { cx: 960, cy: 150, size: 76 });
  const caps = Captions(g, [['SU CUERPO MANEJA EL AZÚCAR DISTINTO', 'maneja', { hi: 'SU CUERPO' }], ['NO ES CASTIGO · NO ES DESCUIDO', 'castigo', { fill: C.green, hi: 'NO ES', hiColor: C.ink }]], { cy: 975, size: 50 });
  return t => {
    st.draw(t, at('idea'));
    st.g.setAttribute('opacity', +st.g.getAttribute('opacity') * (1 - prog(t, at('maneja') - 0.3, at('maneja'))));
    punch(z, t, at('maneja'), 960, 560, 0.08);
    organs.forEach(([o, x, y], i) => { o.setAttribute('opacity', prog(t, at('maneja') + 0.3 + i * 0.3, at('maneja') + 0.6 + i * 0.3)); });
    caps(t);
  };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
