<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 9 — three questions for your appointment (held, readable), CTA, close.
window.START = at('b9') - 0.4;
window.END = 588.0 + 2.5;          // voice.mp3 ends at 588.0 s; hold the last card
window.DURATION = window.END;
const svg = Stage();

// 1. three questions: Carmen's notebook on the left, the questions on the right (held ≥ 10 s)
scene(svg, () => START, () => at('coment'), g => {
  const pic = el('g', {}, g); const st = still(pic, 'f_lista', { x: 40, y: 150, w: 640, h: 820, focus: [0.45, 0.5], zoom: 0.06 });
  const head = Caption(g, '3 PREGUNTAS PARA SU CITA', { cx: 1270, cy: 110, size: 58, hi: '3 PREGUNTAS' });
  const qs = [['¿Cuál es mi meta de A1C?', '¿Cómo cambió este año?', 'q1'], ['¿Alguna medicina me sube', 'el azúcar? (lleve las cajas)', 'q2'], ['¿Qué fuerza es segura para mí?', '¿Cómo evito que me baje mucho?', 'q3']].map(([a, b, k], i) => {
    const c = el('g', {}, g), y = 210 + i * 270;
    const bg = el('rect', { x: 730, y, width: 1150, height: 230, rx: 26, fill: C.white, stroke: C.ink, 'stroke-width': 6 }, c);
    el('circle', { cx: 830, cy: y + 115, r: 62, fill: C.orange, stroke: C.ink, 'stroke-width': 6 }, c);
    Text(c, String(i + 1), { x: 830, y: y + 118, size: 72, color: C.white });
    Text(c, a, { x: 930, y: y + 85, size: 46, anchor: 'start' }); Text(c, b, { x: 930, y: y + 155, size: 42, anchor: 'start', color: C.blueDark });
    return [c, bg, k];
  });
  return t => {
    st.draw(t, START, at('coment'));
    show(head, t, START + 0.2, 1e9, { dy: -20, dur: 0.3 });
    qs.forEach(([c, bg, k], i) => {
      slideIn(c, t, at(k) - 0.3, 'r', 300);
      const on = t > at(k) - 0.2 && (i === 2 || t < at(qs[i + 1][2]) - 0.2);
      set(bg, { stroke: on ? C.orange : C.ink, 'stroke-width': on ? 10 : 6 });
    });
  };
});

// 2. comment prompt
scene(svg, () => at('coment'), () => at('manda'), g => {
  const st = full(g, 'c_desayuno', { focus: [0.6, 0.4], zoom: 0.1 });
  const b = el('g', {}, g); Icon.bubble(b, 1430, 120, 3.6);
  const caps = Captions(g, [['¿CUÁNTOS AÑOS CON DIABETES?', 'anos', { hi: '¿CUÁNTOS AÑOS' }], ['LEEMOS TODOS LOS COMENTARIOS', 'leemos', { fill: C.green }]], { cy: 970 });
  return t => { st.draw(t, at('coment'), at('manda')); pop(b, t, at('coment') + 0.2, 1610, 300); if (t > at('coment') + 0.6) float(b, t, 1610, 300, { amp: 6 }); caps(t); };
});

// 3. share + subscribe + next video
scene(svg, () => at('manda'), () => at('recuerde'), g => {
  const st = full(g, 'f_mensaje', { focus: [0.5, 0.45], zoom: 0.1 });
  const sub = el('g', {}, g); Card(sub, { x: 1310, y: 90, w: 520, h: 140, fill: C.red, r: 70 }); Text(sub, 'SUSCRÍBASE', { x: 1570, y: 162, size: 60, color: C.white });
  const caps = Captions(g, [['MÁNDESELO A SU FAMILIA', 'manda', { hi: 'SU FAMILIA' }], ['ENTIENDA SU DIABETES', 'suscribase'], ['MIÉRCOLES: EL A1C EXPLICADO', 'miercoles', { fill: C.blue, hi: 'MIÉRCOLES:', hiColor: C.ink }]], { cy: 970 });
  return t => { st.draw(t, at('manda'), at('recuerde')); pop(sub, t, at('suscribase'), 1570, 160); caps(t); };
});

// 4. close (the one full dark card)
scene(svg, () => at('recuerde'), () => END + 1, g => {
  el('rect', { width: 1920, height: 1080, fill: C.ink }, g);
  const pic = el('g', {}, g); still(pic, 'c_baile', { x: 560, y: 120, w: 800, h: 450, focus: [0.5, 0.5], zoom: 0 }).draw(0, 0, 1);
  const a = Text(g, 'INFORMACIÓN, NO UNA CONSULTA', { x: 960, y: 680, size: 56, color: C.cream });
  const b = Text(g, 'Hable con su médico antes de cambiar algo', { x: 960, y: 760, size: 42, weight: 700, color: C.blueFar });
  const c = Text(g, 'CUÍDESE MUCHO', { x: 960, y: 900, size: 110, color: C.amber });
  return t => { show(pic, t, at('recuerde')); show(a, t, at('recuerde') + 0.3); show(b, t, at('recuerde') + 0.8); show(c, t, at('cuidese')); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
