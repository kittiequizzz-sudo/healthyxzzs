<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beats 4–5 — what the guidelines say.
window.START = at('b4') - 0.4;
window.END = at('b6') - 0.4;
window.DURATION = window.END;
const svg = Stage();

// 1. the guidelines (Carmen and her doctor)
scene(svg, () => START, () => at('pocas'), g => {
  const st = full(g, 'e_doctora', { focus: [0.5, 0.45], zoom: 0.1 });
  const k = Kicker(g, 'LO QUE DICEN LAS GUÍAS');
  const caps = Captions(g, [['ASOCIACIÓN AMERICANA DE DIABETES', 'ada', { size: 50 }], ['ESTÁNDARES 2026 · ADULTOS MAYORES', 'ed2026', { size: 50, hi: '2026' }]], { cy: 970 });
  return t => { st.draw(t, START, at('pocas')); show(k, t, START + 0.1, 1e9, { dy: -20, dur: 0.3 }); caps(t); };
});

// 2. A1C goal: a gauge, needle in the green for healthy older adults, amber for frailer ones
scene(svg, () => at('pocas'), () => at('vecina'), g => {
  const cx = 960, cy = 700, R = 420;
  const arc = (a0, a1, col) => {
    const p = a => [cx + R * Math.cos(Math.PI * (1 - a)), cy - R * Math.sin(Math.PI * (1 - a))];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    el('path', { d: `M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}`, fill: 'none', stroke: col, 'stroke-width': 90 }, g);
  };
  arc(0, 0.45, C.green); arc(0.45, 0.72, C.amber); arc(0.72, 1, C.red);
  el('path', { d: `M${cx - R - 45} ${cy} A${R + 45} ${R + 45} 0 0 1 ${cx + R + 45} ${cy}`, fill: 'none', stroke: C.ink, 'stroke-width': 8 }, g);
  const needle = el('g', {}, g);
  el('path', { d: `M${cx - 18} ${cy} L${cx} ${cy - R + 40} L${cx + 18} ${cy} Z`, fill: C.ink }, needle);
  el('circle', { cx, cy, r: 34, fill: C.ink }, g);
  Text(g, 'A1C', { x: cx, y: cy + 90, size: 54, color: C.blueDark });
  const healthy = el('g', {}, g); const hs = still(healthy, 'e_parque', { x: 60, y: 120, w: 440, h: 260, zoom: 0 }); hs.draw(0, 0, 1);
  const frail = el('g', {}, g); const fs = still(frail, 'c_hipo', { x: 1420, y: 120, w: 440, h: 260, zoom: 0 }); fs.draw(0, 0, 1);
  const caps = Captions(g, [['MAYORES SANOS: A1C < 7–7,5 %', 'siete', { fill: C.green, hi: '< 7–7,5 %', hiColor: C.ink }], ['MÁS FRÁGIL: META MENOS ESTRICTA', 'fragilidad', { fill: C.amber, color: C.ink, hi: 'MENOS ESTRICTA', hiColor: C.red }]], { cy: 980 });
  Source(g, 'ADA · Estándares de Atención 2026 · Sección 13');
  return t => {
    const a = lerp(0.3, 0.6, E.inOut(prog(t, at('fragilidad'), at('fragilidad') + 1)));
    const wob = 2 * Math.sin(t * 3) * prog(t, at('pocas'), at('pocas') + 1);
    needle.setAttribute('transform', `rotate(${(-90 + a * 180 + wob).toFixed(2)} ${cx} ${cy})`);
    show(healthy, t, at('pocas')); show(frail, t, at('fragilidad'));
    caps(t);
  };
});

// 3. your goal is yours; medicine can go up… or down
scene(svg, () => at('vecina'), () => at('movimiento'), g => {
  const z = el('g', {}, g);
  const st = full(z, 'e_doctora', { focus: [0.5, 0.4], zoom: 0.1 });
  const stamp = Stamp(g, 'SU META ES SUYA', { cx: 960, cy: 180, size: 84 });
  const arrows = el('g', {}, g);
  el('circle', { cx: 760, cy: 560, r: 120, fill: C.white, stroke: C.ink, 'stroke-width': 8 }, arrows); Arrow(arrows, 760, 640, 760, 470, C.red, 26);
  el('circle', { cx: 1160, cy: 560, r: 120, fill: C.white, stroke: C.ink, 'stroke-width': 8 }, arrows); Arrow(arrows, 1160, 480, 1160, 650, C.green, 26);
  const caps = Captions(g, [['MEDICINAS CON POCO RIESGO', 'pocoriesgo'], ['AJUSTAR: SUBIR… O BAJAR', 'osea', { hi: 'O BAJAR', hiColor: C.green }]], { cy: 970 });
  return t => {
    st.draw(t, at('vecina'), at('movimiento')); stamp.draw(t, at('vecina'));
    stamp.g.setAttribute('opacity', +stamp.g.getAttribute('opacity') * (1 - prog(t, at('pocoriesgo') - 0.3, at('pocoriesgo'))));
    pop(arrows, t, at('subirla') - 0.2, 960, 560); caps(t);
  };
});

// 4. movement: 150 min a week (walking) + strength 2–3 days
scene(svg, () => at('movimiento'), () => at('info'), g => {
  const s1 = full(g, 'e_parque', { focus: [0.5, 0.5], zoom: 0.1 });
  const s2 = full(g, 'f_banda', { focus: [0.5, 0.45], zoom: 0.1 });
  const week = el('g', {}, g);
  el('rect', { x: 560, y: 60, width: 800, height: 120, rx: 60, fill: C.ink, opacity: 0.85 }, week);
  const days = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d, i) => {
    const c = el('circle', { cx: 630 + i * 110, cy: 120, r: 40, fill: C.cream, stroke: C.white, 'stroke-width': 4 }, week);
    Text(week, d, { x: 630 + i * 110, y: 123, size: 34, color: C.ink });
    return c;
  });
  const badge = el('g', {}, g); el('circle', { cx: 1760, cy: 860, r: 110, fill: C.white, stroke: C.orange, 'stroke-width': 8 }, badge); cut(badge, 'm_tienda', 1760, 860, 170);
  const caps = Captions(g, [['150 MIN POR SEMANA', 'm150', { hi: '150 MIN' }], ['FUERZA: 2–3 DÍAS, NO SEGUIDOS', 'fuerza', { hi: 'FUERZA' }], ['CUIDA LAS PUERTAS (CLAVE 2)', 'porque', { fill: C.green, hi: 'PUERTAS', hiColor: C.ink }]], { cy: 970 });
  Source(g, 'ADA · Estándares de Atención 2026');
  return t => {
    const k = E.inOut(prog(t, at('fuerza') - 0.2, at('fuerza') + 0.3));
    s1.g.setAttribute('opacity', 1 - k); s2.g.setAttribute('opacity', k);
    s1.draw(t, at('movimiento'), at('fuerza')); s2.draw(t, at('fuerza'), at('info'));
    show(week, t, at('m150') - 0.2, 1e9, { dy: -20, dur: 0.3 });
    days.forEach((c, i) => {
      const walk = i < 5 && t > at('mediahora') + i * 0.25, str = [0, 2, 4].includes(i) && t > at('noseguidos');
      c.setAttribute('fill', str ? C.blue : walk ? C.green : C.cream);
    });
    pop(badge, t, at('porque'), 1760, 860); caps(t);
  };
});

// 5. information, not a consultation
scene(svg, () => at('info'), () => END + 1, g => {
  const st = full(g, 'e_doctora', { focus: [0.6, 0.4], zoom: 0.08 });
  const caps = Captions(g, [['INFORMACIÓN, NO UNA CONSULTA', 'info', { hi: 'NO UNA CONSULTA', hiColor: C.amber }], ['ANTES DE CAMBIAR: HABLE CON SU MÉDICO', 'equipo', { fill: C.green, size: 50, hi: 'HABLE CON SU MÉDICO', hiColor: C.ink }]], { cy: 970 });
  return t => { st.draw(t, at('info'), END); caps(t); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
