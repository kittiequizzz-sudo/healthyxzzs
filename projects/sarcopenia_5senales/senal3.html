<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#E0EEF8;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="sizes.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Señal 3 — shorter steps, dragging feet.
window.START = at('h3') - 0.3;
window.END = at('h4') - 0.3;
window.DURATION = window.END;
const svg = Stage('s3');

// 1. kicker
stillScene(svg, 'p1c', () => START, () => at('zapatos'), { focus: [0.5, 0.6], zoom: 0.12 }, g => {
  const k = Kicker(g, 3, 'TUS PASOS'); Progress(g, 2);
  return t => slideIn(k, t, START + 0.2, 'l', 600);
});
// 2. your shoes tell a story
scene(svg, () => at('zapatos'), () => at('punta'), g => {
  const z = el('g', {}, g); const cz = cut(z, 'zapato', 760, 540, 640);
  const s = 640 / 441, x0 = 760 - 97 * s, y0 = 540 - 220.5 * s;
  const co = Callout(g, x0 + 115 * s, y0 + 70 * s, 110);
  const a = Chip(g, 'LA HISTORIA DE TUS ZAPATOS', { cx: 1360, cy: 380, fill: C.white, size: 44 });
  const b = Chip(g, 'MIRA LAS SUELAS', { cx: 1360, cy: 560, fill: ACC, color: C.white, size: 50 });
  sfx('pop', at('desgastan'));
  return t => { float(cz, t, 760, 540, { amp: 6 }); pop(z, t, at('zapatos'), 760, 540); show(a, t, at('zapatos') + 0.5); show(b, t, at('suelas')); co(t, at('desgastan')); };
});
// 3–4. worn toe? tripping?
stillScene(svg, 'p1a', () => at('punta'), () => at('tropiezas'), { focus: [0.6, 0.35], zoom: 0.14 }, g => {
  const c = CAP(g, '¿LA PUNTA DESGASTADA?', { hi: 'PUNTA' });
  return t => show(c, t, at('punta') + 0.2);
});
stillScene(svg, 'p1b', () => at('tropiezas'), () => at('maspasos'), { focus: [0.5, 0.5], zoom: 0.14 }, g => {
  const c = CAP(g, '¿TROPIEZAS?', { hi: 'TROPIEZAS' });
  return t => show(c, t, at('tropiezas') + 0.2);
});
// 5. more steps for the same distance
scene(svg, () => at('maspasos'), () => at('grupos'), g => {
  const host = Host(g, 'three_q', { cx: 460, cy: 600, fit: 800 });
  const b = Bubble(g, '¿Más pasos para lo mismo?', { cx: 1250, cy: 330, size: 54 });
  const c = Chip(g, '+60: PRESTA ATENCIÓN', { cx: 1250, cy: 640, fill: ACC, color: C.white, size: 54 });
  sfx('pop', at('maspasos') + 0.3); sfx('ding', at('merecen'));
  return t => { host(t, at('maspasos')); pop(b, t, at('maspasos') + 0.3, 1250, 330); pop(c, t, at('merecen'), 1250, 640); };
});
// 6. the muscles of walking
scene(svg, () => at('grupos'), () => at('perdemos'), g => {
  const body = el('g', {}, g); cut(body, 'cuerpo', 520, 540, 760);
  const calf = el('g', {}, g); const cc = cut(calf, 'gemelo', 1300, 470, 560);
  const s = 760 / 466, x0 = 520 - 124 * s, y0 = 540 - 233 * s;
  const marks = [['CADERAS', 'caderas', x0 + 124 * s, y0 + 235 * s, 900, 420], ['LEVANTAN EL PIE', 'levantar3', x0 + 96 * s, y0 + 405 * s, 900, 860]].map(([txt, k, x, y, lx, ly]) => {
    const c = el('g', {}, g);
    el('line', { x1: x, y1: y, x2: lx - 100, y2: ly, stroke: C.ink, 'stroke-width': 4, 'stroke-dasharray': '10 10' }, c);
    el('circle', { cx: x, cy: y, r: 16, fill: ACC, stroke: C.ink, 'stroke-width': 4 }, c);
    Chip(c, txt, { cx: lx, cy: ly, fill: C.white, size: 38 }); sfx('pop', at(k), 0.7); return [c, k];
  });
  const g1 = Chip(g, 'GEMELOS Y SÓLEOS', { cx: 1300, cy: 820, fill: ACC, color: C.white, size: 44 });
  const cap = Chip(g, 'TRABAJAN EN EQUIPO', { cx: 960, cy: 120, fill: C.ink, color: C.white, size: 48 });
  sfx('pop', at('gemelos'), 0.7);
  return t => {
    show(body, t, at('grupos')); show(cap, t, at('grupos') + 0.5);
    show(calf, t, at('gemelos') - 0.2); float(cc, t, 1300, 470); show(g1, t, at('gemelos'));
    marks.forEach(([c, k]) => show(c, t, at(k)));
  };
});
// 7. shorter stride, lower feet, slower
scene(svg, () => at('perdemos'), () => at('lentamente'), g => {
  el('line', { x1: 160, y1: 760, x2: 1760, y2: 760, stroke: C.ink, 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
  const path = el('path', { fill: 'none', stroke: ACC, 'stroke-width': 10, 'stroke-dasharray': '18 16', 'stroke-linecap': 'round' }, g);
  const f1 = icon(g, 'feet', 0, 0, 2), f2 = icon(g, 'feet', 0, 0, 2);
  const chips = [['ZANCADA MÁS CORTA', 'zancada', 420], ['PIES MÁS BAJOS', 'pieslevantan', 980], ['MÁS LENTO', 'velocidad3', 1500]].map(([s, k, cx]) => { sfx('pop', at(k), 0.7); return [Chip(g, s, { cx, cy: 920, fill: C.white, size: 40 }), k]; });
  const h = Text(g, 'MENOS FUERZA, MENOS EFICACIA', { x: 960, y: 170, size: 64, color: ACC });
  return t => {
    show(h, t, at('perdemos'));
    const L = 760 - 380 * E.inOut(prog(t, at('zancada'), at('zancada') + 1.5)), H = 230 - 160 * E.inOut(prog(t, at('pieslevantan'), at('pieslevantan') + 1.5));
    const x1 = 960 - L / 2, x2 = 960 + L / 2;
    set(path, { d: `M${x1} 740 Q960 ${740 - 2 * H} ${x2} 740` });
    const u = ((t * (t > at('velocidad3') ? 0.35 : 0.6)) % 1);
    const px = (1 - u) * (1 - u) * x1 + 2 * u * (1 - u) * 960 + u * u * x2, py = (1 - u) * (1 - u) * 740 + 2 * u * (1 - u) * (740 - 2 * H) + u * u * 740;
    f1.setAttribute('transform', `translate(${x1 - 100} 600)`); f2.setAttribute('transform', `translate(${px - 100} ${py - 170})`);
    chips.forEach(([c, k]) => show(c, t, at(k)));
  };
});
// 8. slow changes are hard to notice
scene(svg, () => at('lentamente'), () => at('siguiente3'), g => {
  const host = Host(g, 'front', { cx: 460, cy: 600, fit: 780 });
  const cal = icon(g, 'calendar', 1080, 260, 3);
  const c = CAP(g, 'CAMBIOS LENTOS, DIFÍCILES DE NOTAR', { hi: 'LENTOS' });
  sfx('pop', at('lentamente') + 0.3);
  return t => { host(t, at('lentamente')); pop(cal, t, at('lentamente') + 0.3, 1230, 410); show(c, t, at('lentamente') + 0.8); };
});
// 9. 10 minutes → 15 minutes
stillScene(svg, 'p1d', () => at('siguiente3'), () => at('velocidad'), { focus: [0.4, 0.4], zoom: 0.12 }, g => {
  const a = Chip(g, 'ANTES: 10 MIN', { cx: 1450, cy: 170, fill: C.white, size: 54 });
  const b = Chip(g, 'AHORA: 15 MIN', { cx: 1450, cy: 330, fill: C.red, color: C.white, size: 54 });
  const c = CAP(g, 'MISMO RECORRIDO', { hi: 'MISMO' });
  sfx('pop', at('diez')); sfx('pop', at('quince'));
  return t => { slideIn(a, t, at('diez'), 'r', 500); slideIn(b, t, at('quince'), 'r', 500); show(c, t, at('quince') + 1.5); };
});
// 10. gait speed is measured by professionals
stillScene(svg, 'p2a', () => at('velocidad'), () => at('despacio3'), { focus: [0.45, 0.5], zoom: 0.12 }, g => {
  const c = CAP(g, 'VELOCIDAD AL CAMINAR', { hi: 'VELOCIDAD' });
  const s = Source(g, 'Indicador del consenso europeo de sarcopenia (EWGSOP2)', 1052);
  return t => { show(c, t, at('velocidad') + 0.3); show(s, t, at('velocidad') + 1.5); };
});
// 11. not always sarcopenia
scene(svg, () => at('despacio3'), () => at('interesante'), g => {
  const h = Chip(g, 'NO SIEMPRE ES SARCOPENIA', { cx: 960, cy: 160, fill: C.amber, size: 60 });
  const ts = [['hand', 'ARTICULACIONES', 'articular'], ['brain', 'NERVIOS', 'neuro'], ['walk', 'EQUILIBRIO', 'equilibrio3'], ['pill', 'MEDICAMENTOS', 'medicamentos']].map(([ic, s, k], i) => {
    sfx('pop', at(k), 0.6); return [IconTile(g, ic, s, 960 + (i - 1.5) * 420, 520, { w: 370, h: 380 }), k, 960 + (i - 1.5) * 420];
  });
  const c = CAP(g, 'NO LO ATRIBUYAS A LA EDAD', { hi: 'EDAD' });
  sfx('pop', at('despacio3'));
  return t => { pop(h, t, at('despacio3'), 960, 160); ts.forEach(([c, k, cx]) => pop(c, t, at(k), cx, 520)); show(c, t, at('persistente')); };
});
// 12. muscles need the right stimulus
scene(svg, () => at('interesante'), () => at('pasear'), g => {
  const host = Host(g, 'waving', { cx: 440, cy: 600, fit: 760 });
  const a = IconTile(g, 'walk', 'MOVIMIENTO', 1050, 470, { w: 340, h: 360 });
  const b = IconTile(g, 'dumbbell', 'ESTÍMULO\nDE FUERZA', 1480, 470, { w: 340, h: 360 });
  const c = CAP(g, 'LO VERDADERAMENTE INTERESANTE', { hi: 'INTERESANTE' });
  sfx('pop', at('estimulos') - 1.5); sfx('ding', at('estimulos'));
  return t => { host(t, at('interesante')); show(c, t, at('interesante'), at('estimulos')); pop(a, t, at('estimulos') - 1.5, 1050, 470); pop(b, t, at('estimulos'), 1480, 470); };
});
// 13. walk + strengthen
stillScene(svg, 'p2b', () => at('pasear'), () => at('ejercicio3'), { focus: [0.45, 0.45], zoom: 0.12 }, g => {
  const c = CAP(g, 'PASEO + FUERZA', { hi: 'FUERZA' });
  return t => show(c, t, at('pasear') + 0.3);
});
// 14. exercise: heel raises and knee raises behind a chair
scene(svg, () => at('ejercicio3'), () => at('constancia'), g => {
  const h = Chip(g, 'EJERCICIO · DETRÁS DE UNA SILLA', { cx: 960, cy: 95, fill: ACC, color: C.white, size: 44 });
  const row = PoseRow(g, ['tal1', 'tal2', 'tal3', 'tal4'], [], { y: 170, h: 640 });
  const steps = [['SUJETA EL RESPALDO', 'respaldo'], ['SUBE LOS TALONES DESPACIO', 'talones'], ['AGUANTA 1 SEGUNDO', 'aguanta'], ['BAJA CON CONTROL', 'bajar3'], ['RODILLAS ALTERNAS · SUJÉTATE', 'rodilla']]
    .map(([s, k]) => [CAP(g, s, { cy: 920, size: 52 }), k]);
  const cnt = Counter(g, { cx: 1690, cy: 920 }); cnt.set('8–15 ×');
  const calf = el('g', {}, g); Card(calf, { x: 70, y: 820, w: 300, h: 200 }); cut(calf, 'gemelo', 220, 920, 170); Text(calf, 'PANTORRILLAS', { x: 220, y: 1040, size: 26 });
  ['respaldo', 'talones', 'aguanta', 'bajar3', 'rodilla', 'reps3'].forEach(k => sfx('pop', at(k), 0.6));
  return t => {
    show(h, t, at('ejercicio3'));
    const keys = [at('respaldo'), at('talones'), at('bajar3'), at('rodilla')];
    if (t < at('respaldo')) row.forEach(({ c, st }) => { c.setAttribute('opacity', 0.25); st.draw(t, 0, 1); });
    else if (t < at('reps3') || t >= at('rodilla')) lightRow(row, t, keys);
    else { const i = Math.floor((t - at('reps3')) / 1.1) % 2; row.forEach(({ c, st }, j) => { c.setAttribute('opacity', j === i ? 1 : 0.35); st.draw(t, 0, 1); }); }
    steps.forEach(([c, k], i) => show(c, t, at(k), i < 4 ? at(steps[i + 1][1]) : 1e9));
    show(cnt.g, t, at('reps3')); show(calf, t, at('pantorrillas'));
  };
});
// 15. consistency
scene(svg, () => at('constancia'), () => at('arrastrar'), g => {
  const cal = icon(g, 'calendar', 760, 220, 4);
  const c = CAP(g, 'CONSTANCIA, NO ESPECTÁCULO', { hi: 'CONSTANCIA' });
  sfx('ding', at('constancia'));
  return t => { pop(cal, t, at('constancia') - 0.3, 960, 420); show(c, t, at('constancia')); };
});
// 16. urgent: sudden dragging of one foot
scene(svg, () => at('arrastrar'), () => at('libertad'), g => {
  el('rect', { width: 1920, height: 1080, fill: '#F8D9D2' }, g);
  const w = Warn(g, '¿ARRASTRAS UN PIE DE REPENTE?', ['¿Debilidad en un lado del cuerpo?', '→ ATENCIÓN MÉDICA URGENTE'], { kind: 'red', y: 290 });
  sfx('alert', at('arrastrar'));
  return t => show(w, t, at('arrastrar'));
});
// 17–18. freedom to go out, shop, enjoy
stillScene(svg, 'p2c', () => at('libertad'), () => at('disfrutar'), { focus: [0.5, 0.45], zoom: 0.12 }, g => {
  const c = CAP(g, 'LIBERTAD PARA SALIR', { hi: 'LIBERTAD' });
  return t => show(c, t, at('libertad'));
});
stillScene(svg, 'p2d', () => at('disfrutar'), () => at('enganosa'), { focus: [0.5, 0.45], zoom: 0.1 }, g => {
  const c = CAP(g, 'Y DISFRUTAR DE LA VIDA', { hi: 'DISFRUTAR' });
  return t => show(c, t, at('disfrutar'));
});
// 19. bridge: same weight as always
scene(svg, () => at('enganosa'), () => END + 1, g => {
  const b = el('g', {}, g); const cb = cut(b, 'bascula', 960, 480, 480);
  const q = icon(g, 'question', 1180, 250, 1.6);
  const c = CAP(g, 'EL MISMO PESO DE SIEMPRE…', { hi: 'MISMO PESO' });
  sfx('pop', at('mismopeso'));
  return t => { float(cb, t, 960, 480); pop(b, t, at('enganosa') + 0.3, 960, 480); pop(q, t, at('mismopeso'), 1260, 330); show(c, t, at('mismopeso')); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
