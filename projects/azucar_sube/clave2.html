<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 3b — clave 2: fewer doors.
window.START = at('k2') - 0.5;
window.END = at('k3') - 0.5;
window.DURATION = window.END;
const svg = Stage();

// 1. the muscle is a shop with many doors → it shrinks (full-bleed panels)
scene(svg, () => START, () => at('despues30'), g => {
  const z = el('g', {}, g);
  const s1 = full(z, 'm_tienda', { focus: [0.5, 0.55], zoom: 0.08 });
  const s2 = full(z, 'm_tienda_chica', { focus: [0.4, 0.55], zoom: 0.08 });
  const k = Kicker(g, 'CLAVE 2 · MENOS PUERTAS');
  const caps = Captions(g, [['EL MÚSCULO = UNA TIENDA', 'tienda', { hi: 'TIENDA' }], ['CON LOS AÑOS, SE ACHICA', 'achica', { hi: 'SE ACHICA', hiColor: C.orange }]], { cy: 960 });
  return t => {
    const kk = E.inOut(prog(t, at('achica'), at('achica') + 0.5));
    s1.g.setAttribute('opacity', 1 - kk); s2.g.setAttribute('opacity', kk);
    s1.draw(t, START, at('achica')); s2.draw(t, at('achica'), at('despues30'));
    punch(z, t, at('k2'), 960, 540, 0.06);
    show(k, t, START + 0.1, 1e9, { dy: -20, dur: 0.3 }); caps(t);
  };
});

// 2. muscle mass falls 3–8 % per decade after 30, faster after 60 → sarcopenia
scene(svg, () => at('despues30'), () => at('menospuertas'), g => {
  Progress(g, 1);
  const X = a => 160 + (a - 30) / 50 * 1100, Y = m => 820 - (m - 55) / 45 * 600;
  const ch = el('g', {}, g);
  el('line', { x1: 140, y1: 840, x2: 1300, y2: 840, stroke: C.ink, 'stroke-width': 8, 'stroke-linecap': 'round' }, ch);
  [30, 40, 50, 60, 70, 80].forEach(a => Text(ch, String(a), { x: X(a), y: 890, size: 40, weight: 800, color: C.grey }));
  const pts = []; let m = 100;
  for (let a = 30; a <= 80; a++) { pts.push([X(a), Y(m)]); m *= a < 60 ? 0.995 : 0.988; }
  const line = el('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L'), fill: 'none', stroke: C.red, 'stroke-width': 16, 'stroke-linecap': 'round', 'stroke-dasharray': 1600, 'stroke-dashoffset': 1600 }, ch);
  const v60 = el('line', { x1: X(60), y1: 200, x2: X(60), y2: 840, stroke: C.amber, 'stroke-width': 8, 'stroke-dasharray': '18 14', opacity: 0 }, ch);
  // the muscle itself shrinking next to the chart
  const mus = el('g', {}, g); cut(mus, 'calf', 0, 0, 560);
  const big = Text(g, '−3 a 8 %', { x: 1600, y: 870, size: 96, color: C.red });
  const caps = Captions(g, [['CADA 10 AÑOS, DESPUÉS DE LOS 30', 'p38'], ['DESPUÉS DE LOS 60: MÁS RÁPIDO', 'despues60', { fill: C.amber, color: C.ink }], ['SARCOPENIA', 'sarcopenia', { size: 72, hi: 'SARCOPENIA', hiColor: C.red }]], { cy: 990, size: 46 });
  const src = Text(g, 'Volpi y col. · 2004 · promedios; curva ilustrativa', { x: 720, y: 1050, size: 24, weight: 700, color: C.grey });
  return t => {
    const u = E.inOut(prog(t, at('despues30'), at('despues60') + 1.5));
    line.setAttribute('stroke-dashoffset', 1600 * (1 - u));
    v60.setAttribute('opacity', prog(t, at('despues60'), at('despues60') + 0.4));
    const k = 1 - 0.3 * u;
    mus.setAttribute('transform', `translate(1600 ${430 + 6 * Math.sin(t * 2)}) scale(${k.toFixed(3)} 1)`);
    show(big, t, at('p38'), 1e9, { dy: 30, dur: 0.3 });
    caps(t);
  };
});

// 3. fewer doors + rusty locks → sugar stays in the blood
scene(svg, () => at('menospuertas'), () => at('mismoplato'), g => {
  Progress(g, 1);
  const shop = el('g', {}, g); const sp = still(shop, 'm_tienda_chica', { x: 80, y: 180, w: 760, h: 420, focus: [0.4, 0.5], zoom: 0 }); sp.draw(0, 0, 1);
  const lock = el('g', {}, g); cut(lock, 'candado_oxidado', 460, 760, 260);
  const ch = el('g', {}, g);
  el('line', { x1: 940, y1: 820, x2: 1840, y2: 820, stroke: C.ink, 'stroke-width': 7 }, ch);
  const before = el('path', { d: 'M960 780 C1080 780 1120 560 1220 550 C1320 540 1380 760 1520 780 L1820 780', fill: 'none', stroke: C.green, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-dasharray': 1400, 'stroke-dashoffset': 1400 }, ch);
  const now = el('path', { d: 'M960 780 C1080 780 1140 480 1260 460 C1420 440 1560 600 1700 680 S1800 720 1820 730', fill: 'none', stroke: C.red, 'stroke-width': 14, 'stroke-linecap': 'round', 'stroke-dasharray': 1400, 'stroke-dashoffset': 1400 }, ch);
  const caps = Captions(g, [['MENOS MÚSCULO = MENOS PUERTAS', 'menospuertas', { hi: 'MENOS PUERTAS' }], ['EL AZÚCAR SE QUEDA EN LA SANGRE', 'quedamas', { hi: 'SE QUEDA', hiColor: C.red }]], { cy: 980, size: 50 });
  return t => {
    show(shop, t, at('menospuertas')); pop(lock, t, at('menospuertas') + 1.4, 460, 760);
    show(ch, t, at('quedamas') - 0.6);
    before.setAttribute('stroke-dashoffset', 1400 * (1 - E.inOut(prog(t, at('quedamas') - 0.4, at('quedamas') + 0.8))));
    now.setAttribute('stroke-dashoffset', 1400 * (1 - E.inOut(prog(t, at('quedamas') + 0.6, at('quedamas') + 2))));
    caps(t);
  };
});

// 4. same plate, smaller shop
scene(svg, () => at('mismoplato'), () => at('ojo'), g => {
  Progress(g, 1);
  const mk = (x, year, shop) => {
    const c = el('g', {}, g);
    const yr = Caption(c, year, { cx: x + 390, cy: 210, size: 52, fill: C.white, color: C.blueDark });
    cut(c, 'plato', x + 390, 380, 380);
    const s = el('g', {}, c); still(s, shop, { x: x + 40, y: 530, w: 700, h: 380, focus: [0.5, 0.5], zoom: 0 }).draw(0, 0, 1);
    return c;
  };
  const a = mk(140, '2016', 'm_tienda'), b = mk(1000, '2026', 'm_tienda_chica');
  const caps = Captions(g, [['LA COMIDA ES LA MISMA', 'lacomida'], ['LA TIENDA ES MÁS CHICA', 'maschica', { hi: 'MÁS CHICA', hiColor: C.orange }]], { cy: 990 });
  return t => { slideIn(a, t, at('mismoplato'), 'l', 300); slideIn(b, t, at('mismoplato') + 0.4, 'r', 300); caps(t); };
});

// 5. thin or heavy, it doesn't matter
scene(svg, () => at('ojo'), () => END + 1, g => {
  const body = el('g', {}, g); cut(body, 'body', 0, 0, 760);
  const mus = el('g', {}, g); cut(mus, 'calf', 0, 0, 420);
  const caps = Captions(g, [['GORDO O FLACO: DA IGUAL', 'ojo', { hi: 'DA IGUAL' }], ['DELGADOS TAMBIÉN PIERDEN MÚSCULO', 'delgadas', { hi: 'PIERDEN MÚSCULO', hiColor: C.red }]], { cy: 980, size: 50 });
  return t => {
    body.setAttribute('transform', `translate(700 ${500 + 5 * Math.sin(t * 2)})`);
    slideIn(mus, t, at('delgadas') - 0.3, 'r', 400);
    const k = 1 - 0.3 * E.inOut(prog(t, at('delgadas') + 0.4, at('delgadas') + 1.6));
    mus.setAttribute('transform', mus.getAttribute('transform') + ` translate(1300 480) scale(${k.toFixed(3)} 1)`);
    caps(t);
  };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
