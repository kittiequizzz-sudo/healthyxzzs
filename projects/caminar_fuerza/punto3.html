<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#E0EEF8;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="sizes.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Punto 3 — glucose: city analogy, insulin, glycogen, GLUT4, walking after meals, safety with insulin.
window.START = at('h3') - 0.3;
window.END = at('h4') - 0.3;
window.DURATION = window.END;
const svg = Stage('p3');

stillScene(svg, 'a1a', () => START, () => at('invisible3'), { focus: [0.45, 0.6], zoom: 0.12 }, g => {
  const k = Kicker(g, 3, 'EL AZÚCAR EN SANGRE'); Progress(g, 2);
  const ch = [['ARROZ', 'arroz'], ['PAN', 'pan']].map(([s, k], i) => { sfx('pop', at(k), 0.6); return [Chip(g, s, { cx: 1600, cy: 260 + i * 130, fill: C.white, size: 48 }), k]; });
  const q = Chip(g, '¿Y TUS MÚSCULOS?', { cx: 1500, cy: 520, fill: ACC, color: C.white, size: 48 });
  return t => { slideIn(k, t, START + 0.2, 'l', 600); ch.forEach(([c, k]) => slideIn(c, t, at(k), 'r', 400)); pop(q, t, at('comun') - 1, 1500, 520); };
});
stillScene(svg, 'a1b', () => at('invisible3'), () => at('ciudad'), { focus: [0.5, 0.4], zoom: 0.12 }, g => {
  const a = CAP(g, 'ENERGÍA · METABOLISMO · SALUD', { hi: 'METABOLISMO' });
  const b = CAP(g, 'LOS MÚSCULOS: CLAVE', { hi: 'CLAVE' });
  return t => { show(a, t, at('invisible3') + 1, at('papel')); show(b, t, at('papel')); };
});
// city: roads (blood), fuel (glucose), cells need to let it in; insulin is the key
scene(svg, () => at('ciudad'), () => at('problema3'), g => {
  const h = Text(g, 'TU CUERPO, UNA CIUDAD', { x: 960, y: 130, size: 70, color: ACC });
  const road = el('g', {}, g);
  el('path', { d: 'M100 560 C 500 420, 900 700, 1300 560', fill: 'none', stroke: '#E9B3AB', 'stroke-width': 110, 'stroke-linecap': 'round' }, road);
  el('path', { d: 'M100 560 C 500 420, 900 700, 1300 560', fill: 'none', stroke: C.white, 'stroke-width': 6, 'stroke-dasharray': '30 30' }, road);
  Text(road, 'SANGRE = CARRETERAS', { x: 600, y: 760, size: 40, color: C.red });
  const dots = []; for (let i = 0; i < 10; i++) dots.push(el('circle', { r: 20, fill: C.amber, stroke: C.ink, 'stroke-width': 4 }, g));
  const fuel = Chip(g, 'GLUCOSA = COMBUSTIBLE', { cx: 600, cy: 330, fill: C.amber, size: 40 });
  const cell = el('g', {}, g); cut(cell, 'celula', 1580, 560, 440);
  const cl = Chip(g, 'MÚSCULO', { cx: 1580, cy: 830, fill: C.white, size: 40 });
  const ins = Chip(g, 'INSULINA = LLAVE', { cx: 1580, cy: 280, fill: C.green, color: C.white, size: 42 });
  const sens = Chip(g, 'CON LOS AÑOS: LLAVE MENOS EFICAZ', { cx: 960, cy: 980, fill: C.red, color: C.white, size: 40 });
  sfx('pop', at('carreteras')); sfx('pop', at('combustible')); sfx('pop', at('entrar')); sfx('ding', at('insulina')); sfx('alert_soft', at('sensibilidad'));
  return t => {
    show(h, t, at('ciudad')); show(road, t, at('carreteras'));
    show(fuel, t, at('combustible')); show(cell, t, at('entrar') - 0.3); show(cl, t, at('entrar')); pop(ins, t, at('insulina'), 1580, 280); show(sens, t, at('sensibilidad'));
    const open = t > at('insulina') ? (t > at('sensibilidad') ? 0.45 : 1) : 0;
    dots.forEach((d, i) => {
      const u = ((t * 0.18 + i / 10) % 1); const into = open && (i % 10) < 10 * open && u > 0.75;
      const x = into ? lerp(1300, 1500, (u - 0.75) / 0.25) : 100 + 1200 * Math.min(u / 0.75, 1);
      const y = into ? 560 : 560 - 140 * Math.sin(Math.PI * Math.min(u / 0.75, 1)) * 0.6 + (x > 900 ? 40 : 0);
      set(d, { cx: x, cy: y, opacity: t > at('combustible') ? (u > 0.98 ? 0 : 1) : 0 });
    });
  };
});
stillScene(svg, 'a1d', () => at('problema3'), () => at('interesante3'), { focus: [0.5, 0.5], zoom: 0.12 }, g => {
  const a = CAP(g, 'CON LOS AÑOS: LLAVE MENOS EFICAZ', { size: 54, hi: 'MENOS EFICAZ' });
  return t => show(a, t, at('sensibilidad'));
});
// muscles as glucose stores; walking after meals
scene(svg, () => at('interesante3'), () => at('despues3'), g => {
  const m = el('g', {}, g); const cm = cut(m, 'muslo_lado', 700, 540, 640);
  const tank = el('g', {}, g);
  el('rect', { x: 1160, y: 260, width: 300, height: 520, rx: 40, fill: C.white, stroke: C.ink, 'stroke-width': 5 }, tank);
  const lvl = el('rect', { x: 1180, width: 260, rx: 30, fill: C.amber }, tank);
  Text(tank, 'GLUCÓGENO', { x: 1310, y: 840, size: 44 });
  const c = CAP(g, 'UN GRAN DEPÓSITO DE AZÚCAR', { hi: 'DEPÓSITO' });
  sfx('pop', at('depositos')); sfx('swish', at('consumen'), 0.6);
  return t => {
    float(cm, t, 700, 540); show(m, t, at('interesante3')); show(tank, t, at('depositos')); show(c, t, at('depositos'));
    const v = t < at('consumen') ? 0.8 * prog(t, at('depositos'), at('glucogeno') + 2) : 0.8 - 0.4 * E.inOut(prog(t, at('consumen'), at('consumen') + 2));
    set(lvl, { y: 760 - 480 * v, height: 480 * v });
  };
});
stillScene(svg, 'a1c', () => at('despues3'), () => at('mecanismo'), { focus: [0.5, 0.45], zoom: 0.1 }, g => {
  const a = CAP(g, 'CAMINAR DESPUÉS DE COMER', { hi: 'DESPUÉS DE COMER' });
  const b = Chip(g, '+ FUERZA = OTRO ESTÍMULO', { cx: 1450, cy: 140, fill: ACC, color: C.white, size: 44 });
  sfx('pop', at('fuerza3'));
  return t => { show(a, t, at('despues3')); pop(b, t, at('fuerza3'), 1450, 140); };
});
// GLUT4 doors open with contraction
scene(svg, () => at('mecanismo'), () => at('noazucar'), g => {
  const cell = el('g', {}, g); const cc = cut(cell, 'celula', 960, 540, 700);
  const lab = Chip(g, 'GLUT4: PUERTAS DE ENTRADA', { cx: 960, cy: 140, fill: ACC, color: C.white, size: 52 });
  const ex = Chip(g, 'SE ABREN AL CONTRAER EL MÚSCULO', { cx: 960, cy: 940, fill: C.white, size: 44 });
  const no = Chip(g, 'SIN DEPENDER SOLO DE LA INSULINA', { cx: 960, cy: 940, fill: C.green, color: C.white, size: 44 });
  sfx('pop', at('glut4')); sfx('ding', at('sininsulina'));
  return t => { float(cc, t, 960, 540, { amp: 6 }); show(cell, t, at('mecanismo')); pop(lab, t, at('glut4'), 960, 140); show(ex, t, at('glut4') + 3, at('sininsulina')); show(no, t, at('sininsulina')); };
});
// beyond sugar: heart and body composition
scene(svg, () => at('noazucar'), () => at('aprovechar'), g => {
  const a = el('g', {}, g); cut(a, 'corazon', 620, 470, 380); Chip(a, 'CAMINAR · CORAZÓN', { cx: 620, cy: 760, fill: C.white, size: 40 });
  const b = el('g', {}, g); cut(b, 'muslo_lado', 1300, 470, 420); Chip(b, 'FUERZA · MÚSCULO', { cx: 1300, cy: 760, fill: C.white, size: 40 });
  const c = CAP(g, 'TENSIÓN Y DIABETES TIPO 2', { hi: 'DIABETES' });
  sfx('pop', at('aerobico')); sfx('pop', at('composicion'));
  return t => { pop(a, t, at('noazucar') + 0.3, 620, 470); pop(b, t, at('composicion'), 1300, 470); show(c, t, at('hipertension')); };
});
// how: plan
scene(svg, () => at('aprovechar'), () => at('diabetes3'), g => {
  const h = Text(g, 'CÓMO HACERLO', { x: 960, y: 140, size: 76, color: ACC });
  const a = IconTile(g, 'walk', 'TRAS COMER\n10–15 MIN', 640, 470, { w: 420, h: 440 });
  const b = IconTile(g, 'dumbbell', 'FUERZA\n2–3 DÍAS/SEMANA', 1280, 470, { w: 420, h: 440 });
  const c = CAP(g, 'SIN AGOTARTE · CON REGULARIDAD', { hi: 'REGULARIDAD' });
  sfx('pop', at('quince')); sfx('pop', at('dias3'));
  return t => { show(h, t, at('aprovechar')); pop(a, t, at('quince'), 640, 470); pop(b, t, at('dias3'), 1280, 470); show(c, t, at('agotado3')); };
});
// insulin: ask about lows
scene(svg, () => at('diabetes3'), () => at('recuerda3'), g => {
  const st = still(g, 'a2b', { ...LEFT, focus: [0.6, 0.6], zoom: 0.1 });
  const w = el('g', {}, g); Card(w, { x: 1310, y: 200, w: 560, h: 560, fill: C.white });
  el('rect', { x: 1310, y: 200, width: 560, height: 110, rx: 36, fill: C.amber }, w);
  Text(w, '¿INSULINA?', { x: 1590, y: 257, size: 50 });
  ['Pregunta cómo evitar', 'bajadas de azúcar', 'al hacer ejercicio'].forEach((s, i) => Text(w, s, { x: 1590, y: 400 + i * 70, size: 40 }));
  const j = el('g', {}, g); const s2 = still(j, 'a2c', { x: 1340, y: 560, w: 500, h: 300, r: 22, zoom: 0.05 });
  sfx('alert_soft', at('diabetes3'));
  return t => { st.draw(t, at('diabetes3'), at('recuerda3')); show(w, t, at('diabetes3')); show(j, t, at('bajadas') + 1); s2.draw(t, at('bajadas'), at('recuerda3')); };
});
stillScene(svg, 'a2a', () => at('recuerda3'), () => at('fascinante3'), { focus: [0.45, 0.45], zoom: 0.1 }, g => {
  const a = CAP(g, 'MÚSCULO = CONTROL DEL METABOLISMO', { size: 54, hi: 'METABOLISMO' });
  return t => show(a, t, at('recuerda3') + 0.5);
});
stillScene(svg, 'a2d', () => at('fascinante3'), () => at('cerebro3'), { focus: [0.5, 0.45], zoom: 0.1 }, g => {
  const a = CAP(g, 'MÁS ALLÁ DE LAS PIERNAS', { hi: 'MÁS ALLÁ' });
  return t => show(a, t, at('fascinante3') + 2);
});
scene(svg, () => at('cerebro3'), () => END + 1, g => {
  const b = el('g', {}, g); const cb = cut(b, 'cerebro', 960, 470, 600);
  const c = CAP(g, 'HASTA TU CEREBRO', { hi: 'CEREBRO' });
  sfx('ding', at('cerebro3') + 1);
  return t => { float(cb, t, 960, 470); pop(b, t, at('cerebro3'), 960, 470); show(c, t, at('cerebro3') + 1); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
