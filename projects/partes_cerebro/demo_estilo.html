<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F7F6F2;overflow:hidden}
  svg{display:block}
  text{font-family:Inter,sans-serif}
</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Style test: "2D minimalist brain character" (owner's mascot sheet, characters/brainy).
// White bodies, thick black ink, pastel pink brain, yellow sparks; bubbles and cards drawn the same way.
window.DURATION = 14;
const BP = { bg: '#F7F6F2', ink: '#1B1A22', pink: '#F49A9A', pinkD: '#E0707A', yellow: '#F7C531', blue: '#4A7BC0', shadow: '#C9D3E6' };
const svg = document.getElementById('s');
el('rect', { width: 1920, height: 1080, fill: BP.bg }, svg);
const CH = { thinking: [320, 766], idea: [373, 799], reading: [321, 695], strong: [377, 766], thumbs: [357, 714] };
const BR = n => `../../characters/brainy/cut/${n}.png`;
function Char(parent, name, cx, floor, h) {
  const [iw, ih] = CH[name], s = h / ih, g = el('g', {}, parent);
  el('image', { href: BR(name), x: cx - iw * s / 2, y: floor - h, width: iw * s, height: h }, g);
  return g;
}
// hand-drawn style bubble: white, thick ink outline, small tail
function Bubble(parent, str, { cx, cy, size = 64, hi = '', tail = 'l' }) {
  const g = el('g', {}, parent);
  const back = el('g', {}, g);
  const t = el('text', { x: cx, y: cy + 3, 'font-size': size, 'font-weight': 900, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: BP.ink }, g);
  if (hi && str.includes(hi)) {
    const [a, b] = str.split(hi);
    for (const [s, c] of [[a, BP.ink], [hi, BP.pinkD], [b, BP.ink]]) if (s) { const sp = el('tspan', { fill: c }, t); sp.textContent = s; }
  } else t.textContent = str;
  const w = t.getComputedTextLength() + size * 1.4, h = size * 1.9;
  const tx = tail === 'l' ? cx - w / 2 + 70 : cx + w / 2 - 70;
  el('path', { d: `M${tx - 24} ${cy + h / 2 - 4} L${tx + (tail === 'l' ? -40 : 40)} ${cy + h / 2 + 46} L${tx + 26} ${cy + h / 2 - 4} Z`, fill: '#fff', stroke: BP.ink, 'stroke-width': 7, 'stroke-linejoin': 'round' }, back);
  el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: h / 2, fill: '#fff', stroke: BP.ink, 'stroke-width': 7 }, back);
  el('rect', { x: tx - 22, y: cy + h / 2 - 12, width: 44, height: 12, fill: '#fff' }, back);
  return g;
}
function sparks(parent, cx, cy, r, color = BP.yellow) {
  const g = el('g', {}, parent);
  for (let i = 0; i < 5; i++) {
    const a = (-150 + i * 30) * Math.PI / 180;
    el('line', { x1: cx + Math.cos(a) * r, y1: cy + Math.sin(a) * r, x2: cx + Math.cos(a) * (r + 46), y2: cy + Math.sin(a) * (r + 46), stroke: color, 'stroke-width': 14, 'stroke-linecap': 'round' }, g);
  }
  return g;
}
const ground = (parent, x1, x2, y) => el('line', { x1, y1: y, x2, y2: y, stroke: BP.ink, 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.12 }, parent);

// ---- beat A (0–2.6): thinking + "¿SU NOMBRE?"
const A = el('g', {}, svg);
ground(A, 420, 1500, 930);
const aChar = Char(A, 'thinking', 760, 930, 720);
const aB = Bubble(A, '¿SU NOMBRE?', { cx: 1270, cy: 330, size: 84, hi: 'NOMBRE', tail: 'l' });
const tagA = el('g', {}, A); Text(tagA, 'Dramatización', { x: 1780, y: 1030, size: 30, weight: 700, color: '#8A8794', anchor: 'end' });

// ---- beat B (2.6–5.2): zoom on the brain, pulse rings
const B = el('g', {}, svg);
const bWrap = el('g', {}, B);
const ring1 = el('circle', { cx: 960, cy: 300, r: 230, fill: 'none', stroke: BP.pink, 'stroke-width': 14 }, bWrap);
const ring2 = el('circle', { cx: 960, cy: 300, r: 230, fill: 'none', stroke: BP.pink, 'stroke-width': 10 }, bWrap);
const bChar = Char(bWrap, 'reading', 960, 1620, 1500);
const bB = Bubble(B, 'UNA PEQUEÑA ALTERACIÓN', { cx: 960, cy: 930, size: 66, hi: 'ALTERACIÓN', tail: 'r' });

// ---- beat C (5.2–8.2): idea + reading, "piensas con CLARIDAD"
const C2 = el('g', {}, svg);
ground(C2, 300, 1620, 940);
const cL = Char(C2, 'idea', 640, 940, 700), cR = Char(C2, 'thumbs', 1280, 940, 640);
const cB = Bubble(C2, 'piensas con CLARIDAD', { cx: 960, cy: 150, size: 70, hi: 'CLARIDAD', tail: 'l' });

// ---- beat D (8.2–11.2): count-up 86.000 MILLONES, row of mascots
const D = el('g', {}, svg);
const num = Text(D, '0', { x: 960, y: 250, size: 190, color: BP.ink });
const numSub = Text(D, 'MILLONES DE NEURONAS', { x: 960, y: 395, size: 64, color: BP.pinkD });
const src = Text(D, 'Azevedo et al., 2009', { x: 1780, y: 1030, size: 28, weight: 700, color: '#8A8794', anchor: 'end' });
ground(D, 120, 1800, 1000);
const row = ['thinking', 'idea', 'reading', 'strong', 'thumbs'].map((n, i) => Char(D, n, 260 + i * 350, 1000, 470));

// ---- beat E (11.2–14): title card
const E2 = el('g', {}, svg);
const eTitle = el('g', {}, E2);
Text(eTitle, 'LAS PARTES', { x: 1180, y: 380, size: 150, color: BP.ink });
Text(eTitle, 'DEL CEREBRO', { x: 1180, y: 540, size: 150, color: BP.pinkD });
const chip = el('g', {}, E2);
el('rect', { x: 960, y: 650, width: 440, height: 96, rx: 48, fill: BP.yellow, stroke: BP.ink, 'stroke-width': 7 }, chip);
Text(chip, 'PARTE 1 DE 3', { x: 1180, y: 700, size: 52, color: BP.ink });
ground(E2, 140, 760, 960);
const eChar = Char(E2, 'strong', 420, 960, 760);

window.draw = t => {
  cutVis(A, t, 0, 2.6); cutVis(B, t, 2.6, 5.2); cutVis(C2, t, 5.2, 8.2); cutVis(D, t, 8.2, 11.2); cutVis(E2, t, 11.2, 99);
  // A
  slideIn(aChar, t, 0, 'l', 300); if (t > 0.45) float(aChar, t, 760, 600, { amp: 7, tilt: 1 });
  pop(aB, t, 0.9, 1270, 330); show(tagA, t, 0.3);
  // B: lean in on the brain, rings expand
  punch(bWrap, t, 3.0, 960, 330, 0.1);
  for (const [r, off] of [[ring1, 0], [ring2, 0.6]]) {
    const u = ((t - 2.6 + off) % 1.2) / 1.2;
    set(r, { r: 220 + u * 160, opacity: (0.8 * (1 - u)).toFixed(3) });
  }
  pop(bB, t, 3.4, 960, 930);
  // C
  slideIn(cL, t, 5.2, 'l', 360); slideIn(cR, t, 5.5, 'r', 360);
  if (t > 6.0) { float(cL, t, 640, 600, { amp: 6 }); float(cR, t, 1280, 600, { amp: 6, phase: 0.4 }); }
  pop(cB, t, 6.0, 960, 150);
  // D: number counts up while mascots pop in one by one
  const k = E.out(prog(t, 8.4, 10.0));
  num.textContent = Math.round(86000 * k).toLocaleString('es-ES');
  show(numSub, t, 8.6); show(src, t, 8.8);
  row.forEach((g, i) => { pop(g, t, 8.5 + i * 0.25, 260 + i * 350, 800); });
  // E
  show(eTitle, t, 11.4, 1e9, { dy: 60 }); pop(chip, t, 12.1, 1180, 700);
  slideIn(eChar, t, 11.2, 'l', 400); if (t > 11.7) float(eChar, t, 420, 600, { amp: 7 });
};
window.draw(0);
</script>
</body></html>
