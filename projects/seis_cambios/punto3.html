<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F7F6F2;overflow:hidden}
  svg{display:block}
  text{font-family:Inter,sans-serif}
</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>

<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Video 2 · opener (silent pre-roll) + Punto 3: memory changes — not every lapse is dangerous.
const PRE = 5;
window.START = at('p3') - PRE;
window.END = window.DURATION = at('p4');
HOOK_END = at('p3') + 35;
const svg = Stage();
const S0 = window.START;
const D = 'Dramatización';

beat(S0, row([['i_turtle', 'MÁS DESPACIO', S0 + 0.1], ['m_inspect', 'MENOS VOLUMEN', S0 + 0.5]], { head: 'ya vimos 2 cambios…', hi: '2 cambios' }));
beat(S0 + 2.3, (g, b) => {
  const m = Mascot(g, 'm_name', { cx: 450, floor: 930, h: 640 });
  const n = txt(g, '6', { x: 1250, y: 290, size: 260, color: K.pink });
  const t1 = txt(g, 'CAMBIOS EN TU CEREBRO', { x: 1250, y: 470, size: 74 });
  const c = Chip(g, 'PARTE 2 DE 3', { cx: 1250, cy: 620, size: 54, fill: K.yellow });
  const ch = txt(g, 'Cerebro y Bienestar', { x: 1250, y: 750, size: 44, weight: 800, color: K.grey });
  return t => { live(m, t, b.a, { dir: 'l' }); pop(n, t, b.a + 0.1, 1250, 290); show(t1, t, b.a + 0.3); pop(c, t, b.a + 0.6, 1250, 620); show(ch, t, b.a + 0.9); };
});
beat('p3', ejercicio(3, 'TU MEMORIA CAMBIA', { hi: 'MEMORIA', sub: 'no todos los olvidos son PELIGROSOS', subHi: 'PELIGROSOS', subAt: 'p3_titulo', m: 'm_name' }));
beat('p3_preocupa', mascot('m_elder', { cap: 'algo que PREOCUPA a muchos', hi: 'PREOCUPA' }));
beat('p3_30', still('s_wedding', { cap: 'hace 30 años: NÍTIDO', hi: 'NÍTIDO', focus: [0.3, 0.45], chips: [['esta mañana: ¿?', 'p3_manana', K.pinkL]] }));
beat('p3_miedo', mascot('m_scared', { cap: 'miedo a perder la MEMORIA', hi: 'MEMORIA' }));
beat('p3_almacena', still('s_drawers', { cap: 'distintos SISTEMAS de memoria', hi: 'SISTEMAS', capAt: 'p3_sistemas', focus: [0.6, 0.45] }));
beat('p3_trabajo', brain({ on: [['frontal', 'p3_trabajo'], ['parietal', at('p3_trabajo') + 0.8]], labels: [['MEMORIA DE TRABAJO', 'frontal', at('p3_trabajo') + 0.5, 230, -170]], mascot: ['m_juggle', 'p3_trabajo'], cap: 'guardar unos SEGUNDOS', hi: 'SEGUNDOS', capAt: at('p3_trabajo') + 3 }));
beat('p3_telefono', still('s_phonenum', { cap: 'un número antes de APUNTARLO', hi: 'APUNTARLO', focus: [0.4, 0.45] }));
beat('p3_eficiente', mascot('m_noise', { cap: 'con distracciones: MENOS EFICIENTE', hi: 'MENOS EFICIENTE', size: 56 }));
beat('p3_palabras', still('s_tongue', { cap: 'en la PUNTA de la lengua', hi: 'PUNTA', focus: [0.55, 0.45], tag: 'Burke & Shafto, 2004' }));
beat('p3_teresa', still('s_teresa', { cap: 'Teresa, 69 años', hi: 'Teresa', tag: D, focus: [0.4, 0.45], chips: [['«busca un DOCUMENTO»', 'p3_hija', '#FFF1B8']] }));
beat('p3_olvida', still('s_teresaforget', { cap: '¿qué tenía que BUSCAR?', hi: 'BUSCAR', tag: D, focus: [0.6, 0.4] }));
beat('p3_recuerda', still('s_teresarecall', { cap: 'se lo repiten: ¡LO RECUERDA!', hi: 'LO RECUERDA', tag: D, focus: [0.5, 0.45] }));
beat('p3_normal', mascot('m_multitask', { cap: 'varias cosas a la vez: NORMAL', hi: 'NORMAL' }));
beat('p3_diferencia', still('s_keys2', { cap: 'una diferencia IMPORTANTE', hi: 'IMPORTANTE', focus: [0.5, 0.45] }));
beat('p3_llaves', (g, b) => {
  const head = hiText(g, 'normal vs SEÑAL DE ALERTA', 'SEÑAL DE ALERTA', { x: 960, y: 110, size: 68 });
  const rows = [['perder las llaves a veces', 'olvidar para qué SIRVEN', 'p3_llaves', 'p3_sirven'], ['tardar con una palabra', 'perder la CONVERSACIÓN', 'p3_palabra', at('p3_palabra') + 3]];
  const its = rows.map(([a, c, k1, k2], i) => {
    const y = 330 + i * 300, l = el('g', {}, g), r = el('g', {}, g);
    el('rect', { x: 120, y: y - 110, width: 800, height: 220, rx: 30, fill: '#CDEFD0', stroke: K.ink, 'stroke-width': 7 }, l); Mark(l, true, 210, y, 0.8); txt(l, a, { x: 590, y, size: 46 });
    el('rect', { x: 1000, y: y - 110, width: 800, height: 220, rx: 30, fill: K.pinkL, stroke: K.ink, 'stroke-width': 7 }, r); Mark(r, false, 1090, y, 0.8); hiText(r, c, c.split(' ').pop(), { x: 1470, y, size: 46 });
    l.cx = 520; l.cy = y; r.cx = 1400; r.cy = y;
    return [[l, k1], [r, k2]];
  }).flat();
  const tag = ExTag(g, 3);
  return t => { show(head, t, b.a); its.forEach(([e, k]) => pop(e, t, tt(k), e.cx, e.cy)); show(tag, t, b.a); };
});
beat('p3_aumentan', still('s_lost', { cap: 'perderse en lugares CONOCIDOS', hi: 'CONOCIDOS', capAt: 'p3_desorient', focus: [0.5, 0.4], chips: [['AUMENTAN', 'p3_aumentan', K.pinkL], ['quitan INDEPENDENCIA', at('p3_aumentan') + 2.5, K.pinkL]] }));
beat(at('p3_desorient') + 3, still('s_doctor2', { cap: 'consulta con un PROFESIONAL', hi: 'PROFESIONAL', focus: [0.6, 0.45] }));
beat('p3_edad', still('s_treatable', { focus: [0.5, 0.5], chips: [['FALTA DE SUEÑO', 'p3_sueno', '#CFE6F7'], ['DEPRESIÓN', 'p3_depresion', '#E5DAF5'], ['MEDICAMENTOS', 'p3_medic', '#FFF1B8'], ['ENFERMEDADES TRATABLES', 'p3_tratables', '#CDEFD0']], tag: 'NIA · Memory problems and aging' }));
beat('p3_alz', big([['olvido ocasional ≠ ALZHÉIMER', 'ALZHÉIMER']], { y: 300, size: 90, pic: 'm_wise' }));
beat('p3_conserva', still('s_chest', { cap: 'tus recuerdos SIGUEN AHÍ', hi: 'SIGUEN AHÍ', focus: [0.6, 0.5] }));
beat('p3_cuestion', mascot('m_pause', { cap: '¿olvido… o falta de ATENCIÓN?', hi: 'ATENCIÓN', capAt: 'p3_concentrar' }));
beat('p3_cuarto', still('s_noise', { cap: 'ruido · interrupciones · MULTITAREA', hi: 'MULTITAREA', capAt: 'p3_ruido', focus: [0.5, 0.45] }));

initBeats(svg, window.END);
window.draw = t => drawBeats(t);
window.draw(window.START);
</script>
</body></html>
