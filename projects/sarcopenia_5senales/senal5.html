<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#FDE6CC;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="sizes.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Señal 5 — stairs that used to be easy now leave you exhausted.
window.START = at('h5') - 0.3;
window.END = at('c0') - 0.3;
window.DURATION = window.END;
const svg = Stage('s5');

// 1. kicker: negotiating with your body
stillScene(svg, 'e1a', () => START, () => at('curioso5'), { focus: [0.35, 0.45], zoom: 0.12 }, g => {
  const k = Kicker(g, 5, 'LAS ESCALERAS'); Progress(g, 4);
  const a = CAP(g, 'NEGOCIAR CON TU CUERPO', { hi: 'NEGOCIAR' });
  const b = Chip(g, 'ANTES: DOS PISOS', { cx: 1500, cy: 260, fill: C.white, size: 48 });
  const c = Chip(g, '¿EL ASCENSOR?', { cx: 1500, cy: 400, fill: ACC, color: C.white, size: 52 });
  sfx('pop', at('dospisos')); sfx('pop', at('ascensor'));
  return t => { slideIn(k, t, START + 0.2, 'l', 600); show(a, t, at('negociar')); slideIn(b, t, at('dospisos'), 'r', 400); slideIn(c, t, at('ascensor'), 'r', 400); };
});
// 2. heavy thighs, no energy, stopping halfway
stillScene(svg, 'e1b', () => at('curioso5'), () => at('frase'), { focus: [0.5, 0.45], zoom: 0.12 }, g => {
  const a = CAP(g, 'NO SIEMPRE EMPIEZA CON DOLOR', { hi: 'DOLOR' });
  const ch = [['MUSLOS PESADOS', 'pesadez'], ['SIN ENERGÍA', 'energia'], ['PARAR A MITAD', 'detenerse']].map(([s, k], i) => { sfx('pop', at(k), 0.6); return [Chip(g, s, { cx: 380, cy: 170 + i * 140, fill: C.white, size: 44 }), k]; });
  return t => { show(a, t, at('curioso5') + 0.3, at('pesadez')); ch.forEach(([c, k]) => slideIn(c, t, at(k), 'l', 400)); };
});
// 3. "it's normal, I'm old"
stillScene(svg, 'e1c', () => at('frase'), () => at('realmente'), { focus: [0.4, 0.4], zoom: 0.12 }, g => {
  const b = Bubble(g, '«Es normal, ya tengo una edad»', { cx: 1250, cy: 180, size: 50 });
  const x = icon(g, 'cross', 1640, 300, 1.4);
  const c = CAP(g, 'UNA FRASE PELIGROSA', { hi: 'PELIGROSA', fill: C.red });
  sfx('pop', at('normal')); sfx('pop', at('normal') + 2.2);
  return t => { show(c, t, at('frase'), at('normal')); pop(b, t, at('normal'), 1250, 180); pop(x, t, at('normal') + 2.2, 1710, 370); };
});
// 4. should ten steps really be exhausting?
scene(svg, () => at('realmente'), () => at('fascinante'), g => {
  const st = el('g', {}, g), steps = [];
  for (let i = 0; i < 10; i++) steps.push(el('rect', { x: 360 + i * 120, y: 860 - (i + 1) * 60, width: 120, height: (i + 1) * 60, fill: i % 2 ? '#F7B977' : C.orange, stroke: C.ink, 'stroke-width': 4 }, st));
  const n = Text(g, '', { x: 960, y: 170, size: 96, color: C.ink });
  const q = Chip(g, '¿DE VERDAD ES NORMAL?', { cx: 960, cy: 980, fill: C.ink, color: C.white, size: 50 });
  for (let i = 0; i < 10; i++) sfx('tick', at('realmente') + 0.5 + i * 0.35, 0.35);
  return t => { steps.forEach((r, i) => r.setAttribute('opacity', prog(t, at('realmente') + 0.5 + i * 0.35, at('realmente') + 0.7 + i * 0.35))); n.textContent = Math.min(10, Math.max(0, Math.floor((t - at('realmente') - 0.5) / 0.35) + 1)) + ' ESCALONES'; show(q, t, at('realmente') + 4); };
});
// 5. lifting your body against gravity
scene(svg, () => at('fascinante'), () => at('mitocondrias'), g => {
  const host = Host(g, 'three_q', { cx: 960, cy: 580, fit: 760 });
  const thigh = el('g', {}, g); cut(thigh, 'muslo_lado', 560, 520, 640);
  const calf = el('g', {}, g); cut(calf, 'gemelo', 1360, 520, 560);
  const up = el('g', {}, g); Arrow(up, 860, 760, 860, 300, C.green, 20); Text(up, 'FUERZA', { x: 860, y: 260, size: 40, color: C.green });
  const dn = el('g', {}, g); Arrow(dn, 1060, 300, 1060, 760, C.red, 20); Text(dn, 'GRAVEDAD', { x: 1060, y: 810, size: 40, color: C.red });
  const l1 = Chip(g, 'CUÁDRICEPS Y GLÚTEOS', { cx: 560, cy: 940, fill: C.white, size: 40 });
  const l2 = Chip(g, 'PANTORRILLAS', { cx: 1360, cy: 940, fill: C.white, size: 40 });
  sfx('pop', at('subes')); sfx('swish', at('gravedad'), 0.6); sfx('pop', at('pantorrillas5'));
  return t => {
    host(t, at('fascinante'), at('subes'));
    show(thigh, t, at('subes')); show(l1, t, at('subes') + 0.5);
    show(up, t, at('gravedad') - 0.5); show(dn, t, at('gravedad'));
    show(calf, t, at('pantorrillas5')); show(l2, t, at('pantorrillas5') + 0.3);
  };
});
// 6. mitochondria: the energy factories
scene(svg, () => at('mitocondrias'), () => at('distincion'), g => {
  const f = el('g', {}, g); const cf = cut(f, 'fibra', 820, 520, 1000);
  const glows = [[700, 470], [820, 430], [900, 560], [1020, 470], [620, 580], [1100, 560]].map(([x, y]) => el('circle', { cx: x, cy: y, r: 46, fill: '#FFE680', opacity: 0 }, g));
  const a = Chip(g, 'MITOCONDRIAS = ENERGÍA', { cx: 1500, cy: 230, fill: ACC, color: C.white, size: 46 });
  const b = Chip(g, 'MENOS ENERGÍA', { cx: 1500, cy: 380, fill: C.ink, color: C.white, size: 46 });
  const c = CAP(g, 'LAS PIERNAS SE CANSAN ANTES', { hi: 'CANSAN' });
  sfx('ding', at('mitocondrias') + 0.5); sfx('pop', at('envejecimiento5') + 3);
  return t => {
    float(cf, t, 820, 520, { amp: 4 }); show(f, t, at('mitocondrias'));
    const dim = 1 - 0.75 * E.inOut(prog(t, at('envejecimiento5') + 2, at('envejecimiento5') + 5));
    glows.forEach((gl, i) => set(gl, { opacity: (0.45 + 0.25 * Math.sin(t * 3 + i)) * dim * prog(t, at('mitocondrias') + 0.5, at('mitocondrias') + 1) }));
    pop(a, t, at('mitocondrias') + 0.5, 1500, 230); show(b, t, at('envejecimiento5') + 3); show(c, t, at('fatigarse'));
  };
});
// 7. not always the muscle: anemia, heart, lungs
scene(svg, () => at('distincion'), () => at('consultar5'), g => {
  const h = Chip(g, 'NO SIEMPRE ES EL MÚSCULO', { cx: 960, cy: 170, fill: C.amber, size: 60 });
  const ts = [['drop', 'ANEMIA', 'anemia'], ['heart', 'CORAZÓN', 'cardiacas'], ['lungs', 'PULMONES', 'respiratorios']].map(([ic, s, k], i) => { sfx('pop', at(k), 0.6); return [IconTile(g, ic, s, 960 + (i - 1) * 460, 540, { w: 400, h: 420 }), k, 960 + (i - 1) * 460]; });
  sfx('pop', at('distincion'));
  return t => { pop(h, t, at('distincion'), 960, 170); ts.forEach(([c, k, cx]) => pop(c, t, at(k), cx, 540)); };
});
stillScene(svg, 'e2a', () => at('consultar5'), () => at('pecho'), { focus: [0.45, 0.45], zoom: 0.12 }, g => {
  const c = CAP(g, '¿ALGO NUEVO O QUE VA A MÁS? CONSULTA', { size: 54, hi: 'CONSULTA' });
  return t => show(c, t, at('consultar5'));
});
// 8. urgent: chest pain, severe breathlessness, fainting
scene(svg, () => at('pecho'), () => at('esperanzadora'), g => {
  el('rect', { width: 1920, height: 1080, fill: '#F8D9D2' }, g);
  const w = Warn(g, '¿DOLOR EN EL PECHO O FALTA DE AIRE?', ['¿Desmayo o mareo importante?', '→ ATENCIÓN MÉDICA URGENTE'], { kind: 'red', y: 290, w: 1500 });
  sfx('alert', at('pecho'));
  return t => show(w, t, at('pecho'));
});
// 9. muscles adapt at any age
stillScene(svg, 'e2d', () => at('esperanzadora'), () => at('competicion'), { focus: [0.55, 0.45], zoom: 0.1 }, g => {
  const a = CAP(g, 'LOS MÚSCULOS SE ADAPTAN', { hi: 'SE ADAPTAN', hiColor: '#9EE0B0' });
  const s = Source(g, 'Fiatarone et al., JAMA 1990: personas de unos 90 años ganaron fuerza con entrenamiento');
  const ch = ['ENTRENAMIENTO', 'DESCANSO', 'ALIMENTACIÓN'].map((x, i) => Chip(g, x, { cx: 460 + i * 500, cy: 120, fill: C.white, size: 40 }));
  sfx('ding', at('adaptacion'));
  return t => { show(a, t, at('esperanzadora') + 0.5); show(s, t, at('adaptacion')); ch.forEach((c, i) => show(c, t, at('entrenamiento') + i * 0.8)); };
});
// 10–12. how to start: calmly, with the handrail; rest; or chair rises
stillScene(svg, 'e1d', () => at('competicion'), () => at('descansa'), { focus: [0.5, 0.45], zoom: 0.12 }, g => {
  const a = CAP(g, 'NO ES UNA COMPETICIÓN', { hi: 'COMPETICIÓN' });
  const b = CAP(g, 'SIEMPRE CON BARANDILLA', { hi: 'BARANDILLA' });
  sfx('ding', at('barandilla'));
  return t => { show(a, t, at('competicion') + 0.3, at('barandilla') - 2); show(b, t, at('barandilla') - 2); };
});
stillScene(svg, 'e2b', () => at('descansa'), () => at('alternativa'), { focus: [0.45, 0.45], zoom: 0.12 }, g => {
  const c = CAP(g, 'DESCANSA CUANDO LO NECESITES', { hi: 'DESCANSA' });
  return t => show(c, t, at('descansa'));
});
stillScene(svg, 'e2c', () => at('alternativa'), () => at('tiempo5'), { focus: [0.5, 0.5], zoom: 0.12 }, g => {
  const c = CAP(g, 'O LEVÁNTATE DE UNA SILLA', { hi: 'SILLA' });
  return t => show(c, t, at('alternativa') + 0.3);
});
// 13. progress gradually
scene(svg, () => at('tiempo5'), () => at('setenta5'), g => {
  const bars = [0, 1, 2, 3, 4].map(i => el('rect', { x: 520 + i * 180, width: 140, rx: 18, fill: C.green, stroke: C.ink, 'stroke-width': 4 }, g));
  const h = Text(g, 'POCO A POCO', { x: 960, y: 170, size: 80, color: ACC });
  const a = Chip(g, '✓ ESFUERZO SALUDABLE', { cx: 620, cy: 960, fill: C.green, color: C.white, size: 44 });
  const b = Chip(g, '✗ AGOTAMIENTO', { cx: 1330, cy: 960, fill: C.red, color: C.white, size: 44 });
  sfx('pop', at('gradual5')); sfx('pop', at('gradual5') + 1.5);
  return t => {
    show(h, t, at('tiempo5'));
    bars.forEach((r, i) => { const hh = (100 + i * 110) * E.out(prog(t, at('tiempo5') + 0.6 + i * 0.5, at('tiempo5') + 1.2 + i * 0.5)); set(r, { y: 840 - hh, height: Math.max(0, hh) }); });
    show(a, t, at('gradual5')); show(b, t, at('gradual5') + 1.5);
  };
});
// 14. 70 doesn't mean giving up strong legs
scene(svg, () => at('setenta5'), () => at('decisiva'), g => {
  const host = Host(g, 'waving', { cx: 460, cy: 580, fit: 760 });
  const c = el('g', {}, g); Card(c, { x: 860, y: 300, w: 960, h: 300, fill: C.white });
  Text(c, '+70 =', { x: 1340, y: 400, size: 90, color: ACC }); Text(c, 'PIERNAS FUERTES', { x: 1340, y: 510, size: 76 });
  const r = CAP(g, 'TU CUERPO RESPONDE AL MOVIMIENTO', { hi: 'RESPONDE' });
  sfx('ding', at('setenta5') + 0.4);
  return t => { host(t, at('setenta5')); pop(c, t, at('setenta5') + 0.4, 1340, 450); show(r, t, at('responder')); };
});
// 15. the decisive question
scene(svg, () => at('decisiva'), () => END + 1, g => {
  const q = el('g', {}, g); Card(q, { x: 260, y: 200, w: 1400, h: 330, fill: C.white });
  Text(q, '¿QUÉ PUEDES HACER', { x: 960, y: 310, size: 76 }); Text(q, 'PARA PROTEGER TUS MÚSCULOS?', { x: 960, y: 420, size: 70, color: ACC });
  const icons = SIGNS.map(([ic], i) => icon(g, ic, 960 + (i - 2) * 220 - 60, 640, 1.2));
  sfx('pop', at('proteger5'));
  return t => { show(q, t, at('decisiva')); icons.forEach((c, i) => show(c, t, at('proteger5') + i * 0.2)); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
