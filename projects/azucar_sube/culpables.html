<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 6 — does this affect me? hidden culprits, hypoglycaemia, emergencies.
window.START = at('b6') - 0.4;
window.END = at('b7') - 0.4;
window.DURATION = window.END;
const svg = Stage();

// 1. "but I feel fine" — high sugar barely hurts
scene(svg, () => START, () => at('prometi'), g => {
  const st = full(g, 'e_parque', { focus: [0.5, 0.45], zoom: 0.1 });
  const caps = Captions(g, [['«PERO YO ME SIENTO BIEN»', 'b6'], ['EL AZÚCAR ALTA CASI NO DUELE', 'noduele', { fill: C.red, hi: 'NO DUELE', hiColor: C.amber }], ['MEJOR ENTENDERLO A TIEMPO', 'atiempo', { fill: C.green }]], { cy: 970 });
  return t => { st.draw(t, START, at('prometi')); caps(t); };
});

// 2. two hidden culprits
scene(svg, () => at('prometi'), () => at('cul1'), g => {
  const cards = [['bolsa', 600], ['c_noche', 1320]].map(([n, x]) => {
    const c = el('g', {}, g);
    Card(c, { x: x - 300, y: 220, w: 600, h: 520, fill: C.ink, r: 34 });
    Text(c, '?', { x, y: 500, size: 340, color: C.amber });
    return [c, x];
  });
  const cap = Caption(g, '2 CULPABLES ESCONDIDOS', { cy: 920, size: 64, hi: '2 CULPABLES', hiColor: C.red });
  return t => { cards.forEach(([c, x], i) => pop(c, t, at('prometi') + 0.3 + i * 0.3, x, 480)); show(cap, t, at('prometi'), 1e9, { dy: 20, dur: 0.3 }); };
});

// 3. culprit 1: other medicines (pictures: pills; one word each)
scene(svg, () => at('cul1'), () => at('todo'), g => {
  const k = Kicker(g, 'CULPABLE 1 · OTRAS MEDICINAS');
  const bag = el('g', {}, g); cut(bag, 'bolsa', 960, 500, 900);   // the medicine bag fills the gap until the first name
  const meds = [['CORTICOIDES', 'cortic', 420], ['DIURÉTICOS', 'diureticos', 960], ['ESTATINAS', 'estatinas', 1500]].map(([s, kk, x], i) => {
    const c = el('g', {}, g);
    el('circle', { cx: x, cy: 460, r: 210, fill: C.white, stroke: C.ink, 'stroke-width': 8 }, c);
    Icon.pill(c, x - 150, 310, 3);
    const lab = Caption(c, s, { cx: x, cy: 740, size: 46 });
    return [c, kk, x];
  });
  const small = Text(g, '(un poco)', { x: 1500, y: 810, size: 34, weight: 800, color: C.blueDark });
  const caps = Captions(g, [['NO LAS DEJE POR SU CUENTA', 'nomalas', { fill: C.red, hi: 'NO', hiColor: C.amber }]], { cy: 960 });
  return t => {
    show(k, t, at('cul1'), 1e9, { dy: -20, dur: 0.3 });
    bag.setAttribute('opacity', (1 - prog(t, at('cortic') - 0.4, at('cortic'))).toFixed(3));
    if (t < at('cortic')) punch(bag, t, at('cul1') + 0.5, 960, 500, 0.06);
    meds.forEach(([c, kk, x], i) => { pop(c, t, at(kk), x, 460); if (t > at(kk) + 0.4) float(c, t, x, 460, { amp: 5, phase: i * 0.4 }); });
    show(small, t, at('estatinas') + 0.6); caps(t);
  };
});

// 4. your doctor must know everything you take
scene(svg, () => at('todo'), () => at('cul2'), g => {
  const st = full(g, 'c_medicinas', { focus: [0.45, 0.65], zoom: 0.12 });
  const caps = Captions(g, [['SU MÉDICO DEBE SABERLO TODO', 'todo', { hi: 'TODO' }], ['¡HASTA LA PASTILLA DE LA VECINA!', 'vecina2', { fill: C.amber, color: C.ink }]], { cy: 970 });
  return t => { st.draw(t, at('todo'), at('cul2')); caps(t); };
});

// 5. culprit 2: poor sleep
scene(svg, () => at('cul2'), () => at('advertencia'), g => {
  const st = full(g, 'c_noche', { focus: [0.3, 0.5], zoom: 0.12 });
  const k = Kicker(g, 'CULPABLE 2 · DORMIR MAL');
  const caps = Captions(g, [['1 NOCHE DE 4 HORAS', 'cuatro', { hi: '4 HORAS' }], ['≈ ¼ PEOR RESPUESTA A LA INSULINA', 'cuarta', { hi: '≈ ¼ PEOR', hiColor: C.red, size: 50 }], ['ESTUDIO MUY PEQUEÑO: 9 PERSONAS', 'pequeno', { fill: C.amber, color: C.ink, size: 50 }], ['¿RONCA? DÍGASELO A SU MÉDICO', 'ronca', { fill: C.green }]], { cy: 970 });
  const src = Text(g, 'Donga y col. · JCEM 2010', { x: 1880, y: 1052, size: 24, weight: 700, color: C.white, anchor: 'end' });
  return t => { st.draw(t, at('cul2'), at('advertencia')); show(k, t, at('cul2'), 1e9, { dy: -20, dur: 0.3 }); caps(t); show(src, t, at('cuarta')); };
});

// 6. warning: insulin / sulfonylureas → sugar can drop too low
scene(svg, () => at('advertencia'), () => at('senales'), g => {
  const st = full(g, 'c_hipo', { focus: [0.45, 0.4], zoom: 0.12 });
  const k = Kicker(g, 'ADVERTENCIA', { size: 44 });
  const caps = Captions(g, [['INSULINA · GLIBENCLAMIDA · GLIMEPIRIDA', 'usainsulina', { size: 48 }], ['+ MÁS EJERCICIO = AZÚCAR MUY BAJA', 'bajarle', { fill: C.red, size: 50, hi: 'AZÚCAR MUY BAJA', hiColor: C.amber }]], { cy: 970 });
  return t => { st.draw(t, at('advertencia'), at('senales')); show(k, t, at('advertencia'), 1e9, { dy: -20, dur: 0.3 }); caps(t); };
});

// 7. the signs (pictures), < 70 mg/dL
scene(svg, () => at('senales'), () => at('urgencias'), g => {
  const ks = ['temblor', 'sudor', 'hambre', 'corazon', 'confusion'];
  const sy = [['TEMBLOR', 'zig'], ['SUDOR FRÍO', 'drop'], ['HAMBRE', 'plate'], ['PALPITACIONES', 'heart'], ['CONFUSIÓN', 'question']].map(([s, ic], i) => {
    const c = el('g', {}, g), x = 200 + i * 380;
    el('circle', { cx: x, cy: 380, r: 160, fill: C.white, stroke: C.red, 'stroke-width': 10 }, c);
    if (ic === 'zig') el('path', { d: `M${x - 100} 380 l35 -70 l35 140 l35 -140 l35 140 l35 -70`, fill: 'none', stroke: C.red, 'stroke-width': 18, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, c);
    else Icon[ic](c, x - 110, 270, 2.2, ic === 'drop' ? C.blue : undefined);
    Text(c, s, { x, y: 600, size: s.length > 10 ? 36 : 44 });
    return [c, x, ks[i]];
  });
  const big = Caption(g, '< 70 mg/dL = AZÚCAR BAJA', { cy: 780, size: 72, hi: '< 70 mg/dL', hiColor: C.amber });
  const pv = Caption(g, 'PREGUNTE CÓMO PREVENIRLO', { cy: 940, size: 48, fill: C.green });
  return t => {
    sy.forEach(([c, x, kk], i) => { pop(c, t, at(kk), x, 380); if (t > at(kk) + 0.4) float(c, t, x, 380, { amp: 4, phase: i * 0.3 }); });
    show(big, t, at('confusion') + 0.8, 1e9, { dy: 20, dur: 0.3 }); show(pv, t, at('prevenirlo') - 0.8, 1e9, { dy: 20, dur: 0.3 });
  };
});

// 8. emergency (safety: kept readable)
scene(svg, () => at('urgencias'), () => END + 1, g => {
  el('rect', { width: 1920, height: 1080, fill: C.red }, g);
  const h = Text(g, 'VAYA A URGENCIAS', { x: 960, y: 140, size: 100, color: C.white });
  const a = el('g', {}, g); Card(a, { x: 160, y: 250, w: 780, h: 300, fill: C.white });
  Text(a, 'AZÚCAR MUY BAJA', { x: 550, y: 340, size: 56, color: C.blue }); Text(a, '+ confusión o desmayo', { x: 550, y: 440, size: 46 });
  const b = el('g', {}, g); Card(b, { x: 980, y: 250, w: 780, h: 300, fill: C.white });
  Text(b, 'AZÚCAR MUY ALTA', { x: 1370, y: 340, size: 56, color: C.red }); Text(b, '+ vómito, mucha sed', { x: 1370, y: 430, size: 46 }); Text(b, 'o confusión', { x: 1370, y: 490, size: 46 });
  const nums = el('g', {}, g); Card(nums, { x: 160, y: 640, w: 1600, h: 300, fill: C.ink });
  Text(nums, 'EMERGENCIAS', { x: 960, y: 700, size: 40, color: C.amber });
  Text(nums, 'México 911 · Colombia 123 · Chile 131 · Perú 106', { x: 960, y: 790, size: 52, color: C.white });
  Text(nums, 'Argentina 107 · España 112 · Rep. Dominicana 911', { x: 960, y: 870, size: 52, color: C.white });
  return t => { show(h, t, at('urgencias')); show(a, t, at('baja')); show(b, t, at('alta')); show(nums, t, at('urgencias') + 1.2); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
