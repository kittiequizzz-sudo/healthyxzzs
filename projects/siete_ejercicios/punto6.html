// Video 3 · Punto 6: working memory (sort 8, 3, 6, 1, 5 and 7, 2, 9, 4, 1, 6 in your head).
window.START = at('p6') - 1.2;
window.END = window.DURATION = at('p7');
HOOK_END = 0;
const svg = Stage();
// numbers shown, then hidden (cards turn to "?"), then the sorted answer
function sortPuzzle(nums, ans, o) {
  return (g, b) => {
    const N = nums.length, gap = Math.min(260, 1600 / N), bw = Math.min(210, gap - 40);
    const xs = nums.map((_, i) => 960 + (i - (N - 1) / 2) * gap);
    const shown = nums.map((s, i) => Box(g, s, xs[i], 360, { w: bw, h: 190, size: 110 }));
    const hid = nums.map((s, i) => Box(g, '?', xs[i], 360, { w: bw, h: 190, size: 110, fill: K.yellow }));
    const sorted = ans.map((s, i) => Box(g, s, xs[i], 360, { w: bw, h: 190, size: 110, fill: '#CDEFD0' }));
    const lab = hiText(g, 'ordénalos de MENOR a MAYOR', 'MENOR a MAYOR', { x: 960, y: 590, size: 70 });
    const th = Think(g, 1660, 800);
    const m = Mascot(g, 'm_count', { cx: 300, floor: 1060, h: 380 });
    const head = hiText(g, o.head, o.headHi, { x: 960, y: 130, size: 64 });
    const tag = ExTag(g, 6);
    return t => {
      const th0 = tt(o.hide), ta = tt(o.ans);
      shown.forEach((x, i) => { if (t < th0) pop(x, t, tt(o.at[i]), x.cx, x.cy); else hide(x); });
      hid.forEach((x, i) => { if (t >= th0 && t < ta) pop(x, t, th0 + i * 0.06, x.cx, x.cy); else hide(x); });
      sorted.forEach((x, i) => { if (t >= ta) pop(x, t, ta + i * (o.step || 0.6), x.cx, x.cy); else hide(x); });
      show(lab, t, tt(o.sortAt)); th.draw(t, tt(o.think[0]), tt(o.think[1])); live(m, t, b.a + 0.2); show(head, t, b.a); show(tag, t, b.a);
    };
  };
}

beat(at('p6') - 1.2, ejercicio(6, 'LA MEMORIA DE TRABAJO', { hi: 'MEMORIA DE TRABAJO', sub: 'organizar INFORMACIÓN', subHi: 'INFORMACIÓN', m: 'm_juggle' }));

beat('p6_recuerda', big([['habilidades CONCRETAS', 'CONCRETAS'], ['≠ más inteligencia ni prevención', '', K.grey]], { y: 250, size: 84, pic: 'm_shrug', at: ['p6_recuerda', at('p6_recuerda') + 4],

beat('p6_utilidad', still('s_memgame', { cap: 'practicar de forma ENTRETENIDA', hi: 'ENTRETENIDA', focus: [0.5, 0.45] }));
beat('p6_sub', cta('sub', { sub: 'ideas y ejercicios para tu mente' }));
