<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../.claude/skills/health-news/news/fonts.css">
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="../../.claude/skills/health-news/news/news.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Documentary demo with real CC0 photos (credits.json), 2.5D parallax clips (scripts/parallax.py) and synthesised SFX (window.SFX → scripts/mix.py).
// No voice yet: times are fixed; a real video keys them to CUE.
window.DURATION = 36;
const svg = NewsStage();
const SZ = { bedroom: [2112, 1402], bp_arm: [2112, 1273], bp_care: [2112, 1433], bp_monitor: [2112, 1207], brain: [2112, 1408],
  burger: [2112, 1409], couple: [2112, 1408], plate: [2112, 1281], salmon: [2112, 1405], steth: [2112, 1409] };
const img = n => ({ href: 'assets/' + n + '.jpg', iw: SZ[n][0], ih: SZ[n][1] });
const photo = (g, n, o) => Photo(g, 'assets/' + n + '.jpg', { iw: SZ[n][0], ih: SZ[n][1], ...o });
const shots = [];
const shot = (a, b, build, hard = true) => { const g = el('g', {}, svg); shots.push({ g, a, b, hard, draw: build(g) }); };

// 1 · cold open on the empty plate
shot(0, 3.2, g => {
  const ph = Clip(g, 'clips/plate', { n: 99, dark: 0.2 });
  const hl = Headline(g, ['¿QUÉ PASA SI DEJA', 'DE CENAR 7 DÍAS?'], { x: 110, y: 300, size: 104, anchor: 'start', hi: 1 });
  return t => { ph.draw(t, 0); hl.draw(t, 0.4); };
});
// 2 · night
shot(3.2, 6.4, g => {
  const ph = Clip(g, 'clips/bedroom', { n: 99, dark: 0.35 });
  const lt = LowerThird(g, { kicker: 'Mientras duerme', title: 'Su cuerpo sigue trabajando' });
  return t => { ph.draw(t, 3.2); lt.draw(t, 3.5); };
});
// 3 · number slam
shot(6.4, 10.4, g => {
  const ph = photo(g, 'steth', { from: [1.05, 0.3, 0.6], to: [1.15, 0.25, 0.65], dark: 0.66, fade: false });
  const n = BigNumber(g, { to: 100000, label: 'latidos al día', x: 960, y: 450 });
  return t => { ph.draw(t, 6.4, 10.4); n.draw(t, 6.6); punch(n.g, t, 7.7, 960, 450, 0.04); };
});
// 4 · brain + callout following the camera
shot(10.4, 14.6, g => {
  const ph = Clip(g, 'clips/brain', { n: 129, dark: 0.1 });
  const co = Callout(g, { r: 110, lx: 1420, ly: 260, text: 'Cerebro' });
  const lt = LowerThird(g, { kicker: 'El cerebro', title: 'Usa 1/5 de la energía en reposo' });
  return t => { ph.draw(t, 10.4); co.draw(t, 11.2, 1e9, [852, 378]); lt.draw(t, 10.7); };
});
// 5 · chapter (after the wipe)
shot(14.6, 18.6, g => {
  const ph = Clip(g, 'clips/bp_care', { n: 122, dark: 0.62 });
  const ch = Chapter(g, { n: 1, title: 'El corazón', sub: 'La presión baja durante la noche' });
  return t => { ph.draw(t, 14.6); ch.draw(t, 14.9); };
}, false);
// 6 · the study
shot(18.6, 24.4, g => {
  const ph = photo(g, 'bp_monitor', { x: 0, w: 1000, from: [1.0, 0.75, 0.5], to: [1.12, 0.8, 0.5], dark: 0.3, fade: false });
  const st = StudyCard(g, { pub: 'Metaanálisis · 2022', title: ['Ayuno con horario', 'y presión arterial'], lines: ['Presión sistólica ≈ −4 mmHg', 'sobre todo al bajar de peso'], hi: 0 });
  return t => { ph.draw(t, 18.6, 24.4); st.draw(t, 18.9, 20.3); };
});
// 7 · comparison
shot(24.4, 29, g => {
  const sp = Split(g, { ...img('salmon'), label: 'Cena ligera', good: true }, { ...img('burger'), label: 'Cena tardía y pesada', good: false });
  return t => sp.draw(t, 24.4, 29, 24.7, 25.8);
});
// 8 · reminder
shot(29, 32.5, g => {
  const ph = Clip(g, 'clips/couple', { n: 108, dark: 0.15 });
  const lt = LowerThird(g, { kicker: 'Recuerde', title: 'Consulte a su médico antes de cambiar' });
  return t => { ph.draw(t, 29); lt.draw(t, 29.3); };
});
// 9 · end card
shot(32.5, 36, g => { const e = EndCard(g, { name: 'SALUD 60+' }); return t => e.draw(t, 32.7); });

const bug = Bug(svg, { name: 'SALUD 60+', section: 'INFORME' });
const sp = SmallPrint(svg);
const notes = [[0, '', 'Imagen ilustrativa'], [6.4, '70 latidos/min × 1.440 min', ''], [10.4, 'NCBI StatPearls · Physiology, Fasting', 'Imagen ilustrativa'],
  [14.6, '', 'Library of Congress'], [18.6, 'metaanálisis 2022 (PMC9644535)', ''], [24.4, '', 'Imagen ilustrativa'], [29, '', 'Imagen ilustrativa'], [32.5, '', '']];
const wipe = Wipe(svg);
const grade = Grade(svg);

// Sound design: [time, effect, gain dB]. Effects come from scripts/sfx.py.
const ticks = Array.from({ length: 14 }, (_, i) => [6.6 + 1.1 * (1 - Math.pow(1 - i / 14, 2)), 'tick', -6]);   // count-up, slowing down
window.SFX = [
  [0.0, 'boom', -10], [0.38, 'swish', -6], [0.95, 'impact', -12],
  [3.2, 'swish', -10], [3.5, 'swish', -8],
  [6.4, 'whoosh', -12], [6.6, 'impact', -4], ...ticks, [8.2, 'heart', -4], [9.2, 'heart', -6],
  [10.4, 'swish', -10], [10.7, 'swish', -8], [11.2, 'marker', -14],
  [13.7, 'riser', -6], [14.35, 'whoosh', -2], [14.8, 'boom', -4],
  [18.6, 'swish', -10], [18.9, 'paper', -2], [20.3, 'marker', -4],
  [24.4, 'whoosh', -10], [24.85, 'ding', -6], [25.95, 'thunk', -6],
  [29, 'swish', -10], [29.3, 'swish', -8],
  [32.3, 'whoosh', -6], [33.1, 'pop', -4],
];

window.draw = t => {
  for (const s of shots) if ((s.hard ? cutVis : sceneVis)(s.g, t, s.a, s.b) > 0) s.draw(t);
  bug.draw(t, 0.3);
  bug.g.style.display = t < 32.5 ? '' : 'none';
  const n = notes.filter(x => t >= x[0]).at(-1);
  sp.set(n[1], n[2]);
  wipe.draw(t, 14.6);
  grade.draw(t);
};
window.draw(0);
</script>
</body></html>
