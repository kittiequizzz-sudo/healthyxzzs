<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 8 — the bigger picture: you're not alone; more medicine isn't failure.
window.START = at('b8') - 0.4;
window.END = at('b9') - 0.4;
window.DURATION = window.END;
const svg = Stage();

// 1. numbers: Mexico 18 of 100; South & Central America 35 million
scene(svg, () => START, () => at('escucharon'), g => {
  const L = el('g', {}, g); Card(L, { x: 120, y: 150, w: 820, h: 760 });
  Text(L, 'MÉXICO', { x: 530, y: 220, size: 54 });
  const people = [];
  for (let i = 0; i < 100; i++) {
    const x = 215 + (i % 10) * 65, y = 300 + Math.floor(i / 10) * 52;
    const p = el('g', {}, L);
    el('circle', { cx: x, cy: y - 12, r: 9 }, p); el('rect', { x: x - 11, y: y - 2, width: 22, height: 22, rx: 8 }, p);
    p.setAttribute('fill', C.grey); people.push(p);
  }
  const n = Text(L, '', { x: 530, y: 870, size: 54, color: C.red });
  const R = el('g', {}, g); Card(R, { x: 1000, y: 150, w: 800, h: 520 });
  Text(R, 'SUDAMÉRICA Y CENTROAMÉRICA', { x: 1400, y: 220, size: 40 });
  const m = Text(R, '', { x: 1400, y: 400, size: 140, color: C.red });
  Text(R, 'adultos con diabetes', { x: 1400, y: 500, size: 44 });
  const src2 = Text(R, 'FID · Atlas de la Diabetes · 2024', { x: 1400, y: 610, size: 30, weight: 700, color: C.grey });
  const solo = Chip(g, 'USTED NO ESTÁ SOLO', { cx: 1400, cy: 800, fill: C.green, color: C.white, size: 56 });
  Source(g, 'ENSANUT 2022 · Salud Pública de México');
  return t => {
    show(L, t, at('mexico') - 0.3);
    const k = Math.round(18 * prog(t, at('dieciocho'), at('dieciocho') + 1.5));
    people.forEach((p, i) => p.setAttribute('fill', i < k ? C.red : C.grey));
    n.textContent = t > at('dieciocho') ? `≈ ${k} de cada 100 adultos` : '';
    show(R, t, at('sudamerica'));
    m.textContent = t > at('millones') - 0.6 ? Math.round(35 * E.out(prog(t, at('millones') - 0.6, at('millones') + 0.6))) + ' M' : '';
    show(solo, t, at('millones') + 2.5);
  };
});

// 2. guilt → a different idea
scene(svg, () => at('escucharon'), () => at('vanidad'), g => {
  const A = el('g', {}, g);
  const st = still(A, 'c_duda', { x: 60, y: 150, w: 1180, h: 690, focus: [0.45, 0.35], zoom: 0.08 });
  const q = el('g', {}, A); Card(q, { x: 1290, y: 280, w: 570, h: 220 });
  Text(q, '«Hay que subirle', { x: 1575, y: 360, size: 46 }); Text(q, 'la medicina»', { x: 1575, y: 425, size: 46, color: C.red });
  const gu = Chip(A, '…Y SE SIENTEN CULPABLES', { cx: 1575, cy: 620, fill: C.amber, size: 36 });
  const Bg = el('g', {}, g);
  const lines = [['NO ES QUE USTED COMA PEOR', 'otraidea', C.ink, 1.5], ['SU CUERPO CAMBIÓ', 'cambio', C.orange, 0], ['SUBIR LA MEDICINA NO ES FRACASAR', 'fracasar', C.ink, 0], ['ES ACOMPAÑAR A UN CUERPO QUE CAMBIA', 'acompanar', C.green, 0]].map(([s, k, col, d], i) => [Text(Bg, s, { x: 960, y: 260 + i * 160, size: i === 1 ? 90 : 60, color: col }), k, d]);
  return t => {
    const sw = at('otraidea') - 0.4, k = E.inOut(prog(t, sw, sw + 0.4));
    A.setAttribute('opacity', 1 - k); A.style.display = k >= 1 ? 'none' : '';
    Bg.setAttribute('opacity', k); Bg.style.display = k <= 0 ? 'none' : '';
    st.draw(t, at('escucharon'), sw); show(q, t, at('escucharon') + 0.5); show(gu, t, at('culpables2'));
    lines.forEach(([e, kk, , d]) => show(e, t, at(kk) + d));
  };
});

// 3. muscle = independence
scene(svg, () => at('vanidad'), () => END + 1, g => {
  const st = still(g, 'c_baile', { x: 60, y: 200, w: 1150, h: 672, focus: [0.4, 0.4], zoom: 0.08 });
  const h = Text(g, 'CUIDAR EL MÚSCULO NO ES VANIDAD', { x: 960, y: 120, size: 64 });
  const l = [['LEVANTARSE SOLO', 'levantarse'], ['CARGAR A UN NIETO', 'nieto'], ['BAILAR EN LA BODA', 'bailar']].map(([s, k], i) => {
    const c = el('g', {}, g); Card(c, { x: 1260, y: 260 + i * 180, w: 600, h: 140, fill: C.green });
    Text(c, s, { x: 1560, y: 332 + i * 180, size: 44, color: C.white });
    return [c, k];
  });
  return t => { st.draw(t, at('vanidad'), END); show(h, t, at('vanidad')); l.forEach(([c, k]) => show(c, t, at(k))); };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
