<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 3a — three characters; clave 1: the rusty lock. Pictures carry it; captions are key phrases.
window.START = at('b3') - 0.3;
window.END = at('k2') - 0.5;
window.DURATION = window.END;
const svg = Stage();

// 0. three characters (big cut-outs, one word each)
scene(svg, () => START, () => at('k1') - 0.2, g => {
  const items = [['llave', 'INSULINA', 'insulina', 380], ['calf', 'MÚSCULO', 'musculo', 960], ['pancreas', 'PÁNCREAS', 'pancreas', 1540]].map(([n, s, k, x]) => {
    const c = el('g', {}, g); cut(c, n, 0, 0, n === 'pancreas' ? 480 : 520);
    const lab = Caption(g, s, { cx: x, cy: 900, size: 48 });
    return { c, lab, k, x };
  });
  const cap = Caption(g, 'TRES PERSONAJES', { cy: 110, size: 52, fill: C.white, color: C.ink });
  return t => {
    show(cap, t, START + 0.2, 1e9, { dy: 20, dur: 0.3 });
    items.forEach((o, i) => {
      slideIn(o.c, t, at(o.k) - 0.1, 'd', 300);
      o.c.setAttribute('transform', o.c.getAttribute('transform') + ` translate(${o.x} ${470 + 8 * Math.sin(t * 2 + i)})`);
      show(o.lab, t, at(o.k), 1e9, { dy: 20, dur: 0.3 });
    });
  };
});

// 1. clave 1 opener: key vs rusty lock, kicker caption
scene(svg, () => at('k1') - 0.2, () => at('sangre') - 0.2, g => {
  const z = el('g', {}, g);
  const k = el('g', {}, z); cut(k, 'llave', 700, 520, 560);
  const l = el('g', {}, z); cut(l, 'candado_oxidado', 1220, 540, 600);
  const c = Caption(g, 'CLAVE 1 · LA CERRADURA OXIDADA', { cy: 960, size: 60, hi: 'CLAVE 1' });
  return t => { punch(z, t, at('k1'), 960, 540, 0.08); show(c, t, at('k1'), 1e9, { dy: 20, dur: 0.3 }); };
});

// 2. the key opens the door: blood → insulin → cell → energy
scene(svg, () => at('sangre') - 0.2, () => at('adonde'), g => {
  Progress(g, 0);
  const vessel = el('g', {}, g);
  el('rect', { x: 60, y: 520, width: 820, height: 220, rx: 110, fill: '#F3B4A8', stroke: C.ink, 'stroke-width': 9 }, vessel);
  const cell = el('g', {}, g);
  el('circle', { cx: 1470, cy: 600, r: 300, fill: '#FBD9C9', stroke: C.ink, 'stroke-width': 9 }, cell);
  el('circle', { cx: 1530, cy: 600, r: 90, fill: '#C58BB0', stroke: C.ink, 'stroke-width': 7 }, cell);
  const door = el('rect', { x: 1156, y: 530, width: 32, height: 140, rx: 8, fill: C.blue, stroke: C.ink, 'stroke-width': 6 }, g);
  const dots = []; for (let i = 0; i < 10; i++) dots.push(el('circle', { r: 26, fill: C.amber, stroke: C.ink, 'stroke-width': 5 }, g));
  const key = el('g', {}, g); cut(key, 'llave', 0, 0, 220);
  const en = el('g', {}, g);
  el('path', { d: 'M1500 440 L1440 600 L1495 600 L1460 750 L1565 565 L1510 565 L1545 440 Z', fill: C.amber, stroke: C.ink, 'stroke-width': 7, 'stroke-linejoin': 'round' }, en);
  const caps = Captions(g, [['AZÚCAR EN LA SANGRE', 'sangre'], ['LA LLAVE = INSULINA', 'eslainsulina', { hi: 'INSULINA' }], ['ABRE LA PUERTA', 'abre'], ['= ENERGÍA', 'energia', { fill: C.amber, color: C.ink }]], { cy: 960 });
  return t => {
    show(vessel, t, at('sangre') - 0.2); show(cell, t, at('salir'));
    dots.forEach((d, i) => {
      const bx = 140 + (i * 83) % 680, by = 630 + 30 * Math.sin(i * 2 + t * 2.5);
      const u = E.inOut(prog(t, at('entra') + i * 0.1, at('entra') + 0.8 + i * 0.1));
      set(d, { cx: lerp(bx, 1350 + (i % 4) * 55, u), cy: lerp(by, 540 + Math.floor(i / 4) * 55, u), opacity: t > at('sangre') ? 1 : 0 });
    });
    const ku = E.inOut(prog(t, at('llave'), at('abre')));
    key.setAttribute('transform', `translate(${lerp(960, 1100, ku)} ${lerp(330, 600, ku) + (ku < 1 ? 8 * Math.sin(t * 3) : 0)}) rotate(${lerp(-20, 90, ku)})`);
    key.setAttribute('opacity', prog(t, at('llave') - 0.3, at('llave')));
    door.setAttribute('transform', `translate(0 ${(-E.inOut(prog(t, at('abre'), at('abre') + 0.5)) * 160).toFixed(1)})`);
    door.setAttribute('opacity', prog(t, at('salir'), at('salir') + 0.3));
    pop(en, t, at('energia'), 1500, 600);
    caps(t);
  };
});

// 3. where does the sugar go? 8 of 10 → muscle
scene(svg, () => at('adonde'), () => at('sigue'), g => {
  Progress(g, 0);
  const bins = [['brain', 'cerebro', 360], [null, 'grasa', 960], ['calf', 'almusculo', 1560]].map(([n, k, x]) => {
    const c = el('g', {}, g);
    if (n) cut(c, n, x, 640, n === 'calf' ? 420 : 340); else Icon.drop(c, x - 120, 520, 2.4, C.amber);
    const no = Icon.cross(c, x + 110, 470, 1.1);
    return { c, k, x, no };
  });
  const dots = []; for (let i = 0; i < 10; i++) dots.push(el('circle', { r: 30, fill: C.amber, stroke: C.ink, 'stroke-width': 5 }, g));
  const caps = Captions(g, [['¿A DÓNDE VA EL AZÚCAR?', 'adonde'], ['AL MÚSCULO', 'almusculo', { fill: C.green }], ['8 DE CADA 10 → AL MÚSCULO', 'ocho', { fill: C.green, hi: '8 DE CADA 10', hiColor: C.ink }]], { cy: 950 });
  Source(g, 'DeFronzo y Tripathy · Diabetes Care 2009 · con insulina activa');
  return t => {
    bins.forEach((b, i) => { show(b.c, t, at('adonde') + 0.2 + i * 0.2); b.no.style.display = (i < 2 && t > at(b.k)) ? '' : 'none'; });
    if (t > at('almusculo')) punch(bins[2].c, t, at('almusculo'), 1560, 640, 0.12);
    dots.forEach((d, i) => {
      const x0 = 510 + i * 100, y0 = 230;
      const target = i < 8 ? [1450 + (i % 4) * 75, 560 + Math.floor(i / 4) * 140] : [i === 8 ? 330 : 990, 560];
      const u = E.inOut(prog(t, at('ocho') + i * 0.1, at('ocho') + 0.9 + i * 0.1));
      set(d, { cx: lerp(x0, target[0], u), cy: lerp(y0, target[1], u), opacity: t > at('adonde') + 0.2 ? 1 : 0 });
    });
    caps(t);
  };
});

// 4. same key, rusty lock → the muscle gets about half
scene(svg, () => at('sigue'), () => END + 1, g => {
  Progress(g, 0);
  const L = el('g', {}, g); cut(L, 'llave', 330, 380, 380); cut(L, 'candado', 620, 380, 420);
  const okL = Icon.check(L, 760, 160, 1.3);
  const R = el('g', {}, g); const rk = el('g', {}, R); cut(rk, 'llave', 1250, 380, 380); cut(R, 'candado_oxidado', 1560, 380, 430);
  const bars = el('g', {}, g);
  cut(bars, 'candado', 160, 725, 95); cut(bars, 'candado_oxidado', 160, 845, 95);   // which lock each bar is
  el('rect', { x: 240, y: 680, width: 1300, height: 90, rx: 18, fill: C.green, stroke: C.ink, 'stroke-width': 6 }, bars);
  const bar = el('rect', { x: 240, y: 800, height: 90, rx: 18, fill: C.red, stroke: C.ink, 'stroke-width': 6 }, bars);
  const half = Text(bars, 'LA MITAD', { x: 920, y: 848, size: 56, anchor: 'start', color: C.red });
  const caps = Captions(g, [['LA LLAVE SIGUE FUNCIONANDO', 'sigue'], ['PERO LA CERRADURA ESTÁ OXIDADA', 'oxidada', { hi: 'OXIDADA', hiColor: C.orange }], ['RESISTENCIA A LA INSULINA', 'resistencia', { hi: 'RESISTENCIA' }]], { cy: 990, size: 50 });
  return t => {
    show(L, t, at('sigue')); okL.style.display = t > at('sigue') + 0.8 ? '' : 'none';
    show(R, t, at('oxidada') - 0.3);
    const sh = t > at('oxidada') ? 9 * Math.sin((t - at('oxidada')) * 22) * Math.exp(-((t - at('oxidada')) % 2.2) * 1.5) : 0;
    rk.setAttribute('transform', `rotate(${sh.toFixed(2)} 1350 380)`);
    show(bars, t, at('mismos'));
    set(bar, { width: 650 * E.inOut(prog(t, at('mitad') - 0.6, at('mitad') + 0.4)) });
    show(half, t, at('mitad') + 0.3);
    caps(t);
  };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
