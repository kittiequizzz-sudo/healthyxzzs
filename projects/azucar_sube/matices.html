<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Beat 7 — nuances; muscle responds at any age.
window.START = at('b7') - 0.4;
window.END = at('b8') - 0.4;
window.DURATION = window.END;
const svg = Stage();

// 1. what we don't fully know: three pictures, a word each
scene(svg, () => START, () => at('sies'), g => {
  const k = Kicker(g, 'LO QUE NO SABEMOS DEL TODO');
  const tiles = [['calf', 'PROMEDIOS', 'promedios', 400], ['c_baile', '80 > 60 A VECES', 'ochenta', 960], ['pancreas', 'ESTUDIO ANTIGUO', 'anterior', 1520]].map(([n, s, kk, x]) => {
    const c = el('g', {}, g);
    el('circle', { cx: x, cy: 480, r: 230, fill: C.white, stroke: C.ink, 'stroke-width': 8 }, c);
    if (n.startsWith('c_')) { const id = 'cc' + kk; const cp = el('clipPath', { id }, c); el('circle', { cx: x, cy: 480, r: 222 }, cp); const gg = el('g', { 'clip-path': `url(#${id})` }, c); el('image', { href: 'cut/' + real(n) + '.png', x: x - 400, y: 480 - 234, width: 800, height: 468 }, gg); }
    else cut(c, n, x, 480, 340);
    Caption(c, s, { cx: x, cy: 790, size: 44 });
    return [c, kk, x];
  });
  return t => { show(k, t, START + 0.1, 1e9, { dy: -20, dur: 0.3 }); tiles.forEach(([c, kk, x], i) => {
    // all three are on screen from the start (dimmed); each lights up and leans in on its word
    c.setAttribute('opacity', (0.25 + 0.75 * prog(t, at(kk) - 0.2, at(kk) + 0.2)).toFixed(3));
    if (t < at(kk)) float(c, t, x, 480, { amp: 4, phase: i * 0.3 }); else punch(c, t, at(kk), x, 480, 0.1);
  }); };
});

// 2. sometimes it IS the food: juice every day → body + plate
scene(svg, () => at('sies'), () => at('claro'), g => {
  const z = el('g', {}, g);
  const st = full(z, 'f_jugo', { focus: [0.5, 0.5], zoom: 0.1 });
  const caps = Captions(g, [['A VECES SÍ ES LA COMIDA', 'sies', { fill: C.amber, color: C.ink }], ['JUGOS TODOS LOS DÍAS', 'jugos'], ['CASI SIEMPRE: CUERPO + PLATO', 'mezcla', { hi: 'CUERPO + PLATO' }]], { cy: 970 });
  return t => { st.draw(t, at('sies'), at('claro')); punch(z, t, at('mezcla'), 960, 450, 0.05); caps(t); };
});

// 3. muscle responds at any age (chair → band)
scene(svg, () => at('claro'), () => END + 1, g => {
  const s1 = full(g, 'c_silla', { focus: [0.5, 0.45], zoom: 0.1 });
  const s2 = full(g, 'f_banda', { focus: [0.5, 0.45], zoom: 0.1 });
  const k = Kicker(g, 'EL MÚSCULO RESPONDE A CUALQUIER EDAD');
  const caps = Captions(g, [['LEVANTARSE DE LA SILLA', 'silla', { hi: 'SILLA' }], ['SUBIR UN ESCALÓN', 'escalon', { hi: 'ESCALÓN' }], ['CARGAR LA BOLSA', 'bolsa', { hi: 'BOLSA' }], ['PREGUNTE QUÉ LE CONVIENE', 'conviene', { fill: C.green }]], { cy: 970 });
  return t => {
    const kk = E.inOut(prog(t, at('bolsa') + 1.2, at('bolsa') + 1.7));
    s1.g.setAttribute('opacity', 1 - kk); s2.g.setAttribute('opacity', kk);
    s1.draw(t, at('claro'), at('bolsa') + 1.7); s2.draw(t, at('bolsa') + 1.2, END);
    show(k, t, at('claro'), 1e9, { dy: -20, dur: 0.3 }); caps(t);
  };
});

window.draw = t => drawScenes(t);
</script>
</body></html>
