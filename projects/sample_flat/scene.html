<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F5ECD7;overflow:hidden}
  svg{display:block}
  text{font-family:Inter,sans-serif}
</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/figure.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
window.DURATION = 28;
const svg = document.getElementById('s');
el('rect', { width: 1920, height: 1080, fill: C.cream }, svg);

// ---------- scene 1: title
const S1 = el('g', {}, svg);
const t1a = Text(S1, 'SIT-UPS', { x: 520, y: 470, size: 136, color: C.ink });
const vs = Text(S1, 'vs', { x: 960, y: 470, size: 90, color: C.orange });
const t1b = Text(S1, 'CURL-UPS', { x: 1420, y: 470, size: 136, color: C.ink });
const sub = Text(S1, 'Which one is safer for your back?', { x: 960, y: 640, size: 58, weight: 700, color: C.blueDark });
const bar1 = el('rect', { x: 360, y: 560, width: 1200, height: 10, rx: 5, fill: C.orange }, S1);

// ---------- scene 2: sit-up as an illustrated step sequence (real drawings, no puppet animation)
const S2 = el('g', {}, svg);
const K2 = 1.5, X2 = 120, Y2 = 822 - 428 * K2;
el('line', { x1: 100, y1: 822, x2: 1180, y2: 822, stroke: C.ink, 'stroke-width': 6, 'stroke-linecap': 'round' }, S2);
const P2 = [0, 1, 2, 3].map(i => el('image', { href: `poses/situp_${i}.png`, x: X2, y: Y2, width: 660 * K2, height: 430 * K2, opacity: 0 }, S2));
// muscle callouts (image-pixel targets per pose)
const HIP = [392, 412], HEAD = [[167, 374], [241, 251], [312, 183], [393, 132]];
const toW = q => [X2 + q[0] * K2, Y2 + q[1] * K2];
const dotAbs = el('circle', { r: 30, fill: 'none', stroke: C.red, 'stroke-width': 9, opacity: 0 }, S2);
const dotHip = el('circle', { r: 30, fill: 'none', stroke: C.red, 'stroke-width': 9, opacity: 0 }, S2);
const arc2 = el('path', { fill: 'none', stroke: C.orange, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-dasharray': '18 16', opacity: 0 }, S2);
const h2 = Text(S2, 'THE SIT-UP', { x: 960, y: 110, size: 92 });
const steps2 = [['1', 'START', 'lie down, knees bent', C.ink], ['2', 'CURL', 'abs lift head + shoulders', C.red], ['3', 'HINGE', 'hip flexors pull you up', C.red]];
const cards2 = steps2.map(([n, a, b, c], i) => {
  const g = Card(S2, { x: 1290, y: 270 + i * 170, w: 520, h: 140, fill: C.white });
  const t1 = Text(g, n + '  ' + a, { x: 1330, y: 320 + i * 170, size: 54, anchor: 'start' });
  Text(g, b, { x: 1330, y: 372 + i * 170, size: 30, weight: 700, color: c, anchor: 'start' });
  return { g, t1 };
});
const dots2 = [0, 1, 2, 3].map(i => el('circle', { cx: 540 + i * 50, cy: 900, r: 11, fill: C.ink, opacity: 0.25 }, S2));

// ---------- scene 3: spine load
const S3 = el('g', {}, svg);
const h3 = Text(S3, 'YOUR LOWER SPINE', { x: 960, y: 130, size: 84 });
const spineG = el('g', {}, S3);
const verts = [], discs = [];
for (let i = 0; i < 5; i++) {
  const y = 320 + i * 118;
  const v = el('g', {}, spineG);
  el('rect', { x: 560, y, width: 230, height: 86, rx: 22, fill: C.bone, stroke: C.ink, 'stroke-width': 6 }, v);
  el('path', { d: `M790 ${y + 20} L880 ${y + 34} L880 ${y + 58} L790 ${y + 66} Z`, fill: C.bone, stroke: C.ink, 'stroke-width': 6, 'stroke-linejoin': 'round' }, v);
  verts.push(v);
  if (i < 4) discs.push(el('rect', { x: 575, y: y + 90, width: 200, height: 26, rx: 13, fill: C.disc, stroke: C.ink, 'stroke-width': 5 }, spineG));
}
const arrows = [];
for (const ax of [610, 740]) arrows.push(el('path', { d: `M${ax} 205 L${ax} 285 M${ax - 26} 257 L${ax} 287 L${ax + 26} 257`, stroke: C.red, 'stroke-width': 16, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, S3));
const num = Text(S3, '0', { x: 1360, y: 470, size: 190, color: C.red });
const unit = Text(S3, 'newtons', { x: 1360, y: 600, size: 60, weight: 800 });
const note = Text(S3, 'squeezing your lower discs in every sit-up', { x: 1360, y: 680, size: 36, weight: 600, color: C.blueDark });
const src3 = Card(S3, { x: 1070, y: 780, w: 580, h: 90, fill: C.amber });
Text(src3, 'Spine biomechanics research (McGill)', { x: 1360, y: 826, size: 30, weight: 800, color: C.white });

// ---------- scene 4: curl-up + EMG bar
const S4 = el('g', {}, svg);
el('line', { x1: 120, y1: 822, x2: 1100, y2: 822, stroke: C.ink, 'stroke-width': 6, 'stroke-linecap': 'round' }, S4);
const K4 = 1.25, X4 = 60, Y4 = 822 - 428 * K4;
const P4 = [0, 1].map(i => el('image', { href: `poses/situp_${i}.png`, x: X4, y: Y4, width: 660 * K4, height: 430 * K4, opacity: 0 }, S4));
const stop4 = Card(S4, { x: 230, y: 250, w: 470, h: 96, fill: C.amber });
Text(stop4, 'STOP HERE', { x: 465, y: 300, size: 50, color: C.white });
const back4 = el('path', { d: `M${X4 + 330 * K4} ${822 + 26} L${X4 + 470 * K4} ${822 + 26}`, stroke: C.green, 'stroke-width': 12, 'stroke-linecap': 'round', opacity: 0 }, S4);
const back4t = Text(S4, 'lower back stays down', { x: X4 + 400 * K4, y: 900, size: 34, weight: 800, color: C.green });
const h4 = Text(S4, 'THE CURL-UP', { x: 960, y: 130, size: 92 });
const cap4 = Text(S4, 'head + shoulders only', { x: 465, y: 380, size: 36, weight: 700, color: C.blueDark });
const chart = el('g', {}, S4);
el('line', { x1: 1240, y1: 760, x2: 1760, y2: 760, stroke: C.ink, 'stroke-width': 6, 'stroke-linecap': 'round' }, chart);
const barBg = el('rect', { x: 1420, y: 360, width: 160, height: 400, rx: 18, fill: '#E9DFC7' }, chart);
const barFg = el('rect', { x: 1420, y: 760, width: 160, height: 0, rx: 18, fill: C.orange, stroke: C.ink, 'stroke-width': 6 }, chart);
const line50 = el('line', { x1: 1380, y1: 560, x2: 1640, y2: 560, stroke: C.ink, 'stroke-width': 4, 'stroke-dasharray': '16 12' }, chart);
const l50 = Text(chart, '50% of max', { x: 1660, y: 560, size: 30, weight: 700, anchor: 'start' });
const barLbl = Text(chart, 'ABS ACTIVITY', { x: 1500, y: 810, size: 34, weight: 800 });
const barVal = Text(chart, '', { x: 1500, y: 320, size: 52, color: C.orange });

// ---------- scene 5: takeaway
const S5 = el('g', {}, svg);
const k1 = Card(S5, { x: 260, y: 300, w: 640, h: 300, fill: C.white });
Text(k1, 'CURL-UP', { x: 580, y: 380, size: 80 });
Text(k1, 'strong abs, less spine bending', { x: 580, y: 450, size: 32, weight: 700, color: C.blueDark });
const chk = el('path', { d: 'M530 525 L570 562 L640 492', stroke: C.green, 'stroke-width': 22, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, k1);
const k2 = Card(S5, { x: 1020, y: 300, w: 640, h: 300, fill: C.white });
Text(k2, 'SIT-UP', { x: 1340, y: 380, size: 80 });
Text(k2, 'skip it if your back hurts', { x: 1340, y: 450, size: 32, weight: 700, color: C.blueDark });
const xx = el('path', { d: 'M1305 495 L1375 565 M1375 495 L1305 565', stroke: C.red, 'stroke-width': 22, fill: 'none', 'stroke-linecap': 'round' }, k2);
const srcs = Text(S5, 'Sources: curl-up vs sit-up EMG (PMC155519) · Sullivan 2015 JSCR · McGill spine load', { x: 960, y: 760, size: 26, weight: 600, color: '#6b6658' });

function vis(g, t, a, b) { const on = t >= a && t < b; g.setAttribute('display', on ? 'inline' : 'none'); return on; }

window.draw = function (t) {
  // scene 1 0–4.5
  if (vis(S1, t, 0, 4.5)) {
    show(t1a, t, 0.1, 4.5); pop(vs, t, 0.6, 960, 470, 4.5); show(t1b, t, 0.9, 4.5);
    set(bar1, { width: 1200 * E.out(prog(t, 1.4, 2.1)), opacity: 1 - prog(t, 4.2, 4.5) });
    show(sub, t, 1.8, 4.5);
  }
  // scene 2 4.5–11
  if (vis(S2, t, 4.5, 11)) {
    show(h2, t, 4.6, 11);
    const keys = [4.7, 5.9, 7.2, 8.5];                       // when each drawing appears
    let cur = 0; keys.forEach((k, i) => { if (t >= k) cur = i; });
    P2.forEach((im, i) => {
      const fadeIn = E.out(prog(t, keys[i], keys[i] + 0.22));
      const fadeOut = i < 3 ? 1 - E.out(prog(t, keys[i + 1], keys[i + 1] + 0.22)) : 1;
      im.setAttribute('opacity', (fadeIn * fadeOut).toFixed(3));
      const z = 1 + 0.025 * prog(t, keys[i], keys[i] + 1.6);  // gentle push-in on each drawing
      const c = toW(HIP);
      im.setAttribute('transform', `translate(${c[0]} ${c[1]}) scale(${z.toFixed(4)}) translate(${-c[0]} ${-c[1]})`);
    });
    dots2.forEach((d, i) => set(d, { opacity: i === cur ? 1 : 0.25, fill: i === cur ? C.orange : C.ink }));
    // abs callout on the curl drawings, hip-flexor callout on the hinge drawing
    const absOn = (t > 6.0 && t < 8.45) ? 1 : 0, hipOn = t > 8.6 ? 1 : 0;
    const hd = HEAD[Math.max(1, Math.min(cur, 2))], abs = toW([HIP[0] + (hd[0] - HIP[0]) * 0.33 + 14, HIP[1] + (hd[1] - HIP[1]) * 0.33 - 8]);
    set(dotAbs, { cx: abs[0], cy: abs[1], opacity: absOn * (0.75 + 0.25 * Math.sin(t * 7)), r: 32 + 5 * Math.sin(t * 7) });
    const hf = toW([HIP[0] + 30, HIP[1] - 40]);
    set(dotHip, { cx: hf[0], cy: hf[1], opacity: hipOn * (0.75 + 0.25 * Math.sin(t * 7)), r: 32 + 5 * Math.sin(t * 7) });
    // dashed motion arc of the head path, drawn on during the rise
    const pts = HEAD.map(toW), arcK = E.inOut(prog(t, 5.9, 9.2));
    set(arc2, { d: `M${pts[0][0] - 20} ${pts[0][1] - 70} Q ${pts[1][0] - 70} ${pts[2][1] - 90} ${pts[3][0] - 10} ${pts[3][1] - 110}`, opacity: 0.85 * arcK });
    arc2.setAttribute('stroke-dashoffset', (-t * 40).toFixed(1));
    cards2.forEach((c, i) => { show(c.g, t, 4.9 + i * 0.25, 11); c.t1.setAttribute('fill', (i === 0 && cur === 0) || (i === 1 && (cur === 1 || cur === 2)) || (i === 2 && cur === 3) ? C.orange : C.ink); });
  }
  // scene 3 11–17.5
  if (vis(S3, t, 11, 17.5)) {
    show(h3, t, 11.1, 17.5);
    const sq = E.inOut(prog(t, 12.4, 13.4)) * (0.6 + 0.4 * Math.sin((t - 12.4) * 5) * prog(t, 13.4, 14));
    discs.forEach((d, i) => set(d, { y: 320 + i * 118 + 90 + 6 * sq, height: 26 - 12 * sq, fill: sq > 0.3 ? C.red : C.disc }));
    verts.forEach((v, i) => v.setAttribute('transform', `translate(0 ${(i * 6 * sq).toFixed(1)})`));
    show(spineG, t, 11.3, 17.5, { dy: 0 });
    arrows.forEach((a, i) => { const k = E.out(prog(t, 12.2 + i * 0.1, 12.7 + i * 0.1)); a.setAttribute('transform', `translate(0 ${(-60 * (1 - k) + 18 * sq).toFixed(1)})`); a.setAttribute('opacity', k.toFixed(2)); });
    const n = Math.round(3300 * E.out(prog(t, 12.6, 14.4)) / 10) * 10;
    num.textContent = n >= 3300 ? '≈3,300' : n.toLocaleString('en-US');
    show(num, t, 12.5, 17.5, { dy: 20 }); show(unit, t, 13.0, 17.5); show(note, t, 13.6, 17.5); show(src3, t, 14.6, 17.5);
  }
  // scene 4 17.5–24
  if (vis(S4, t, 17.5, 24)) {
    // alternate: lying → curled (hold) → lying → curled, crossfading between the two real drawings
    const cyc = ((t - 18.0) % 2.6 + 2.6) % 2.6, up = t < 18.0 ? 0 : (cyc < 0.25 ? cyc / 0.25 : cyc < 1.6 ? 1 : cyc < 1.85 ? 1 - (cyc - 1.6) / 0.25 : 0);
    const e = E.inOut(up);
    P4[0].setAttribute('opacity', (1 - e).toFixed(3)); P4[1].setAttribute('opacity', e.toFixed(3));
    show(h4, t, 17.6, 24); show(stop4, t, 18.3, 24); show(cap4, t, 18.5, 24);
    set(back4, { opacity: E.out(prog(t, 18.8, 19.2)) }); show(back4t, t, 18.9, 24);
    show(chart, t, 19.0, 24, { dy: 0 });
    const v = E.out(prog(t, 19.6, 21.0)) * 0.55;
    set(barFg, { y: 760 - 400 * v, height: 400 * v });
    barVal.textContent = t > 20.9 ? '> 50%' : '';
    show(l50, t, 19.4, 24); show(barVal, t, 20.9, 24, { dy: 10 });
  }
  // scene 5 24–28
  if (vis(S5, t, 24, 28)) {
    pop(k1, t, 24.1, 580, 450); pop(k2, t, 24.5, 1340, 450);
    const c = E.out(prog(t, 25.0, 25.5)); chk.setAttribute('stroke-dasharray', '200'); chk.setAttribute('stroke-dashoffset', (200 * (1 - c)).toFixed(1));
    const x2 = E.out(prog(t, 25.4, 25.9)); xx.setAttribute('stroke-dasharray', '230'); xx.setAttribute('stroke-dashoffset', (230 * (1 - x2)).toFixed(1));
    show(srcs, t, 26.0, 28);
  }
};
window.draw(0);
</script>
</body></html>
