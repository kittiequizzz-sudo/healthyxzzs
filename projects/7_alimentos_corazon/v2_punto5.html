<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F5ECD7;overflow:hidden} svg{display:block} text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="sizes.js"></script>
<script src="cues_v2.js"></script>
<script src="common.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Video 2 · PUNTO 5 — tomate cocinado; end of video 2 (next video + disclaimer).
window.START = at('p5') - 0.8;
window.END = 464.7;
window.DURATION = window.END;
const svg = Stage();

// 0. kicker over the slow sofrito
scene(svg, () => START, () => at('toda_vida'), g => {
  const st = panel(g, 't_sofrito', 'full', { focus: [0.4, 0.4] });
  const k = Kicker(g, 'ALIMENTO 5', 'TOMATE COCINADO');
  return t => { st.draw(t, START, at('toda_vida')); show(k, t, START + 0.3); };
});

// 1. a detail nobody explained: cooked tomate — the sofrito
scene(svg, () => at('toda_vida'), () => at('licopeno'), g => {
  const a = cut(g, 'tomates', 620, 480, 420), b = cut(g, 'sofrito', 1300, 500, 460);
  const ar = Arrow(g, 860, 480, 1040, 480, C.orange, 16);
  const c = Caption(g, 'UN DETALLE: EL SOFRITO', { cy: 880, size: 60, hi: 'SOFRITO' });
  return t => { pop(a, t, at('toda_vida') + 0.5, 620, 480); show(ar, t, at('cocinado')); pop(b, t, at('cocinado') + 0.5, 1300, 500); show(c, t, at('sofrito') - 0.3); };
});

// 2. lycopene: the red pigment, a carotenoid with antioxidant properties
scene(svg, () => at('licopeno'), () => at('fascinante'), g => {
  const glow = el('circle', { cx: 560, cy: 520, r: 280, fill: C.red, opacity: 0.15 }, g);
  cut(g, 'tomates', 560, 520, 520);
  const a = Chip(g, 'LICOPENO', { cx: 1360, cy: 300, size: 72, fill: C.red, color: C.white });
  const b = Text(g, 'el pigmento rojo del tomate', { x: 1360, y: 420, size: 38, weight: 800 });
  const c = Chip(g, 'CAROTENOIDE ANTIOXIDANTE', { cx: 1360, cy: 560, size: 38, fill: C.amber });
  const d = Chip(g, 'PROTEGE FRENTE AL ESTRÉS OXIDATIVO', { cx: 1360, cy: 700, size: 30 });
  return t => { set(glow, { opacity: 0.12 + 0.06 * Math.sin(t * 3) }); show(a, t, at('licopeno')); show(b, t, at('licopeno') + 1); show(c, t, at('carotenoides')); show(d, t, at('carotenoides') + 3); };
});

// 3. heat frees lycopene; oil helps absorb it (fat-soluble)
scene(svg, () => at('fascinante'), () => at('no_cura'), g => {
  const st = panel(g, 'm_licopeno', 'left', { focus: [0.5, 0.5] });
  const a = Chip(g, 'CALOR → LIBERA EL LICOPENO', { cx: 1510, cy: 260, size: 34, fill: C.orange, color: C.white });
  const b = Chip(g, '+ AOVE → SE ABSORBE MEJOR', { cx: 1510, cy: 420, size: 34, fill: C.green, color: C.white });
  const c = Text(g, 'se disuelve en grasa', { x: 1510, y: 520, size: 32, weight: 800 });
  const d = el('g', {}, g);
  Card(d, { x: 1240, y: 620, w: 540, h: 200, fill: C.white });
  Text(d, 'TOMATE CONCENTRADO', { x: 1510, y: 680, size: 32 });
  Text(d, '≈ ×2,5 LICOPENO', { x: 1510, y: 760, size: 50, color: C.red });
  const s = Source(g, 'Absorción de licopeno: concentrado de tomate vs. tomate fresco · Gärtner y col. 1997');
  return t => { st.draw(t, at('fascinante'), at('no_cura')); show(a, t, at('liberacion')); show(b, t, at('aceite')); show(c, t, at('aceite') + 2); show(d, t, at('aceite') + 3); show(s, t, at('aceite') + 3); };
});

// 4. not a cure, not always better than fresh — both are good
scene(svg, () => at('no_cura'), () => at('error5'), g => {
  const st = Stamp(g, 'NO CURA ENFERMEDADES', { cx: 960, cy: 180, size: 64, color: C.orange });
  const a = el('g', {}, g), b = el('g', {}, g);
  cut(a, 'tomates', 600, 520, 340); Mark(a, 'FRESCO', true, { cx: 600, cy: 760, size: 46 });
  cut(b, 'sofrito', 1320, 520, 380); Mark(b, 'COCINADO', true, { cx: 1320, cy: 760, size: 46 });
  const c = Caption(g, 'LOS DOS SUMAN', { cy: 920, size: 56, hi: 'LOS DOS' });
  return t => { st.draw(t, at('no_cura')); show(a, t, at('no_cura') + 1); show(b, t, at('no_cura') + 1.5); show(c, t, at('ambos') + 1); };
});

// 5. the error (watch out, number 5): burnt sofrito, industrial sauces with salt and sugar
scene(svg, () => at('error5'), () => at('alternativa'), g => {
  const a = PanelTile(g, 't_quemado', { x: 90, y: 230, w: 820, h: 540 });
  const b = PanelTile(g, 't_bote', { x: 1010, y: 230, w: 820, h: 540 });
  const ma = Mark(g, 'SOFRITO QUEMADO', false, { cx: 500, cy: 860, size: 40 });
  const mb = Mark(g, 'SALSAS CON SAL Y AZÚCAR', false, { cx: 1420, cy: 860, size: 34 });
  const h = Caption(g, '¡ATENCIÓN AL Nº 5!', { cy: 110, size: 58, hi: 'Nº 5', hiColor: '#FF7A6E' });
  return t => { show(h, t, at('error5')); show(a.g, t, at('error5') + 0.5); show(ma, t, at('quemen')); show(b.g, t, at('industriales') - 0.5); show(mb, t, at('industriales')); a.st.draw(t, at('quemen'), at('alternativa')); b.st.draw(t, at('industriales'), at('alternativa')); };
});

// 6. the alternative: slow-cook with onion, garlic, AOVE; herbs instead of salt
scene(svg, () => at('alternativa'), () => at('ajo'), g => {
  const a = panel(g, 't_sofrito', 'left', { focus: [0.4, 0.5] });
  const b = panel(g, 't_hierbas', 'left', { focus: [0.55, 0.5] });
  const h = Chip(g, 'A FUEGO LENTO', { cx: 1510, cy: 220, size: 52, fill: C.green, color: C.white });
  const ing = el('g', {}, g);
  [['tomates', 1290], ['cebolla', 1440], ['ajo', 1590], ['aove', 1740]].forEach(([n, x]) => cut(ing, n, x, 400, 140));
  const hb = Mark(g, 'HIERBAS EN VEZ DE SAL', true, { cx: 1510, cy: 600, size: 36 });
  const use = Chip(g, 'PARA VERDURAS, LEGUMBRES, PESCADO', { cx: 1510, cy: 760, size: 28, fill: C.amber });
  return t => {
    const k = E.inOut(prog(t, at('hierbas') - 0.2, at('hierbas') + 0.3));
    a.g.setAttribute('opacity', 1 - k); b.g.setAttribute('opacity', k);
    a.draw(t, at('alternativa'), at('hierbas')); b.draw(t, at('hierbas'), at('ajo'));
    show(h, t, at('lentamente')); show(ing, t, at('lentamente') + 1); show(hb, t, at('hierbas')); show(use, t, at('complemento'));
  };
});

// 7. next video: garlic and onion (+ leafy greens)
scene(svg, () => at('ajo'), () => at('informativo'), g => {
  const a = cut(g, 'ajo', 700, 620, 380), b = cut(g, 'cebolla', 1220, 620, 400);
  const c = el('g', {}, g);
  Card(c, { x: 460, y: 120, w: 1000, h: 260, fill: C.ink });
  Text(c, 'A CONTINUACIÓN', { x: 960, y: 200, size: 46, color: C.amber });
  Text(c, 'AJO, CEBOLLA Y', { x: 960, y: 280, size: 54, color: C.cream });
  Text(c, 'VERDURAS DE HOJA VERDE', { x: 960, y: 345, size: 46, color: C.cream });
  return t => { pop(a, t, at('ajo') + 0.5, 700, 620); pop(b, t, at('ajo') + 1, 1220, 620); show(c, t, at('ajo') + 2); };
});

// 8. disclaimer, held to the end
scene(svg, () => at('informativo'), () => END + 1, g => {
  const w = Warn(g, 'INFORMACIÓN, NO CONSEJO MÉDICO', ['Enfermedad cardiovascular', 'Problemas renales', 'Medicación'], { y: 140 });
  const pt = PanelTile(g, 'h_farmacia', { x: 210, y: 650, w: 520, h: 330 });
  const s = Chip(g, 'CONSULTA A TU', { cx: 1270, cy: 720, size: 42, fill: C.amber });
  const s2 = Chip(g, 'PROFESIONAL SANITARIO', { cx: 1270, cy: 830, size: 42, fill: C.amber });
  const tag = Chip(g, 'NOS VEMOS EN LA PARTE 3', { cx: 1270, cy: 960, size: 42, fill: C.ink, color: C.amber });
  return t => { show(w, t, at('informativo')); show(pt.g, t, at('informativo') + 0.5); pt.st.draw(t, at('informativo'), END); show(s, t, at('padeces') + 6); show(s2, t, at('padeces') + 6.3); show(tag, t, END - 3); };
}, { fade: 0.4 });

scene(svg, () => START + 2.5, () => at('informativo'), g => { FoodStrip(g, 4); });

window.draw = t => drawScenes(t);
</script>
</body></html>
